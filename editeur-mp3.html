<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur MP3 Web</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--line:#2a2f3a;--text:#e8ecf4;--muted:#9aa4b2;--accent:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0}
  main{padding:20px;max-width:1100px;margin:auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  button,input[type=file],select{font:inherit}
  button{background:#232833;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:white}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  canvas{width:100%;height:180px;background:#0b0d11;border:1px solid var(--line);border-radius:8px;display:block;touch-action:none}
  label{color:var(--muted)}
  input[type=range]{width:220px}
  .status{color:var(--muted)}
  .ok{color:#4ade80;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
  audio{width:100%;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>🎵 Éditeur MP3 Web</h1>
  <input type="file" id="file" accept=".mp3,.wav,.m4a,.ogg,.flac,audio/mpeg,audio/mp3,audio/*">
  <span class="status" id="status">Charge un fichier MP3 pour commencer.</span>
</header>

<main>
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <button id="play">▶︎ Lire</button>
        <button id="pause">⏸ Pause</button>
        <button id="stop">⏹ Stop</button>
        <button id="zoomOut">− Zoom</button>
        <button id="zoomIn">+ Zoom</button>
      </div>
      <span id="time" class="status">0.00 / 0.00 s</span>
    </div>
    <canvas id="wave"></canvas>
    <audio id="player" controls></audio>
    <p class="status">Touche et fais glisser sur la forme d’onde pour sélectionner une zone.</p>
  </div>

  <div class="card">
    <h2 style="margin-top:0;font-size:16px">Édition</h2>
    <div class="grid">
      <div>
        <label>Volume <span id="volVal">100%</span></label><br>
        <input type="range" id="volume" min="0" max="200" value="100">
      </div>
      <div>
        <label>Vitesse <span id="rateVal">1.00×</span></label><br>
        <input type="range" id="rate" min="0.5" max="2" step="0.05" value="1">
      </div>
      <div>
        <label>Fondu entrée (s)</label><br>
        <input type="number" id="fadeIn" min="0" step="0.1" value="0">
      </div>
      <div>
        <label>Fondu sortie (s)</label><br>
        <input type="number" id="fadeOut" min="0" step="0.1" value="0">
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button id="cut" disabled>✂️ Couper la sélection</button>
      <button id="trim" disabled>🎯 Garder la sélection</button>
      <button id="silence" disabled>🔇 Muter la sélection</button>
      <button id="undo">↩︎ Annuler</button>
      <button id="exportSel" class="primary" disabled>⬇︎ Exporter la sélection MP3</button>
      <button id="exportAll" disabled>⬇︎ Exporter tout MP3</button>
    </div>
    <p class="status" id="help">Après « Garder la sélection », clique sur « Exporter tout MP3 » pour télécharger le résultat.</p>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<script>
const fileInput=document.getElementById('file'), statusEl=document.getElementById('status');
const canvas=document.getElementById('wave'), ctx=canvas.getContext('2d');
const player=document.getElementById('player'), timeEl=document.getElementById('time');
const playBtn=document.getElementById('play'), pauseBtn=document.getElementById('pause'), stopBtn=document.getElementById('stop');
const cutBtn=document.getElementById('cut'), trimBtn=document.getElementById('trim'), silenceBtn=document.getElementById('silence');
const undoBtn=document.getElementById('undo'), exportSelBtn=document.getElementById('exportSel'), exportAllBtn=document.getElementById('exportAll');
const volume=document.getElementById('volume'), rate=document.getElementById('rate');
const fadeIn=document.getElementById('fadeIn'), fadeOut=document.getElementById('fadeOut');

let audioBuffer=null, selection=null, zoom=1, offset=0, history=[];
let audioCtx=null, sourceNode=null, gainNode=null, startedAt=0, startOffset=0, playing=false;

function setStatus(t,ok){statusEl.textContent=t;statusEl.className='status'+(ok?' ok':'')}
function enableButtons(){
  const has=!!audioBuffer, sel=!!selection;
  cutBtn.disabled=!(has&&sel); trimBtn.disabled=!(has&&sel); silenceBtn.disabled=!(has&&sel);
  exportSelBtn.disabled=!(has&&sel); exportAllBtn.disabled=!has; undoBtn.disabled=!history.length;
}
function resizeCanvas(){
  canvas.width=canvas.clientWidth*devicePixelRatio;
  canvas.height=180*devicePixelRatio;
  draw();
}
window.addEventListener('resize',resizeCanvas);

fileInput.addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return;
  setStatus('Chargement de '+f.name+'…');
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended')await audioCtx.resume();
    const arrayBuffer=await f.arrayBuffer();
    audioBuffer=await audioCtx.decodeAudioData(arrayBuffer);
    history=[]; selection=null; offset=0; zoom=1;
    player.src=URL.createObjectURL(f);
    enableButtons(); resizeCanvas();
    setStatus('Fichier chargé : '+f.name+' ('+audioBuffer.duration.toFixed(2)+' s). Touche la forme d’onde pour sélectionner.',true);
  }catch(err){
    console.error(err);
    setStatus('Impossible de lire ce fichier : '+err.message);
  }
});

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!audioBuffer)return;
  const data=audioBuffer.getChannelData(0);
  const visible=Math.max(1,Math.floor(data.length/zoom));
  const start=Math.min(offset,data.length-visible);
  const mid=canvas.height/2, step=Math.max(1,Math.floor(visible/canvas.width));
  ctx.strokeStyle='#4f8cff'; ctx.lineWidth=1;
  ctx.beginPath();
  for(let x=0;x<canvas.width;x++){
    const i0=start+Math.floor(x*visible/canvas.width);
    let min=1,max=-1;
    for(let i=i0;i<Math.min(i0+step,data.length);i++){const v=data[i];if(v<min)min=v;if(v>max)max=v}
    ctx.moveTo(x,mid+min*mid); ctx.lineTo(x,mid+max*mid);
  }
  ctx.stroke();
  if(selection){
    const x1=selection.start/audioBuffer.duration*canvas.width;
    const x2=selection.end/audioBuffer.duration*canvas.width;
    ctx.fillStyle='rgba(79,140,255,.22)';
    ctx.fillRect(Math.min(x1,x2),0,Math.abs(x2-x1),canvas.height);
  }
}

function posToTime(e){
  const rect=canvas.getBoundingClientRect();
  const ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
  return ratio*audioBuffer.duration;
}
let dragging=false;
canvas.addEventListener('pointerdown',e=>{
  if(!audioBuffer)return;
  e.preventDefault(); dragging=true;
  canvas.setPointerCapture(e.pointerId);
  const t=posToTime(e); selection={start:t,end:t};
  enableButtons(); draw();
  setStatus('Sélection en cours : '+t.toFixed(2)+' s');
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging||!audioBuffer)return;
  e.preventDefault();
  selection.end=posToTime(e); draw();
});
canvas.addEventListener('pointerup',e=>{
  if(!dragging)return;
  dragging=false;
  if(selection){
    const a=Math.min(selection.start,selection.end), b=Math.max(selection.start,selection.end);
    if(b-a<0.05){selection=null;setStatus('Sélection trop courte : fais glisser sur au moins 0,05 seconde.');}
    else{selection={start:a,end:b};setStatus('Sélection : '+a.toFixed(2)+' s → '+b.toFixed(2)+' s ('+(b-a).toFixed(2)+' s).',true);}
  }
  enableButtons(); draw();
});
canvas.addEventListener('pointercancel',()=>{dragging=false});

function stopPlayback(){
  if(sourceNode){try{sourceNode.stop()}catch{} sourceNode.disconnect(); sourceNode=null}
  playing=false; playBtn.textContent='▶︎ Lire';
}
function play(from){
  if(!audioBuffer)return;
  stopPlayback();
  sourceNode=audioCtx.createBufferSource(); sourceNode.buffer=audioBuffer;
  gainNode=audioCtx.createGain();
  gainNode.gain.value=volume.value/100;
  sourceNode.playbackRate.value=parseFloat(rate.value);
  sourceNode.connect(gainNode).connect(audioCtx.destination);
  startOffset=from??0; startedAt=audioCtx.currentTime;
  sourceNode.start(0,startOffset);
  playing=true; playBtn.textContent='⏸ Pause';
  sourceNode.onended=()=>{if(playing){playing=false;playBtn.textContent='▶︎ Lire'}};
}
playBtn.onclick=()=>playing?stopPlayback():play(selection?selection.start:0);
pauseBtn.onclick=()=>{if(playing){const elapsed=(audioCtx.currentTime-startedAt)*parseFloat(rate.value);stopPlayback();startOffset+=elapsed}};
stopBtn.onclick=()=>{stopPlayback();startOffset=0};
document.getElementById('zoomIn').onclick=()=>{zoom=Math.min(200,zoom*1.5);draw()};
document.getElementById('zoomOut').onclick=()=>{zoom=Math.max(1,zoom/1.5);offset=0;draw()};
volume.oninput=()=>{document.getElementById('volVal').textContent=volume.value+'%';if(gainNode)gainNode.gain.value=volume.value/100};
rate.oninput=()=>{document.getElementById('rateVal').textContent=parseFloat(rate.value).toFixed(2)+'×';if(sourceNode)sourceNode.playbackRate.value=parseFloat(rate.value)};

function pushHistory(){history.push(audioBuffer);if(history.length>20)history.shift();enableButtons()}
undoBtn.onclick=()=>{
  if(history.length){
    audioBuffer=history.pop();selection=null;enableButtons();draw();
    setStatus('Modification annulée.',true);
  }
};

function makeBuffer(channels,length,sampleRate){return audioCtx.createBuffer(channels,length,sampleRate)}
function copyRange(buf,start,end,mute=false){
  const s=Math.max(0,Math.floor(start*buf.sampleRate));
  const e=Math.min(buf.length,Math.floor(end*buf.sampleRate));
  const out=makeBuffer(buf.numberOfChannels,mute?buf.length:Math.max(1,e-s),buf.sampleRate);
  for(let c=0;c<buf.numberOfChannels;c++){
    const src=buf.getChannelData(c), dst=out.getChannelData(c);
    if(mute){dst.set(src);dst.fill(0,s,e)}
    else dst.set(src.subarray(s,e));
  }
  return out;
}
function applyFades(buf){
  const fi=Math.min(buf.length,Math.floor(parseFloat(fadeIn.value||0)*buf.sampleRate));
  const fo=Math.min(buf.length,Math.floor(parseFloat(fadeOut.value||0)*buf.sampleRate));
  for(let c=0;c<buf.numberOfChannels;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<fi;i++)d[i]*=i/fi;
    for(let i=0;i<fo;i++)d[buf.length-1-i]*=i/fo;
  }
  return buf;
}
function getSel(){
  return [Math.min(selection.start,selection.end),Math.max(selection.start,selection.end)];
}
function afterEdit(msg){
  selection=null; enableButtons(); draw();
  player.src='';
  setStatus(msg+' Clique maintenant sur « Exporter tout MP3 ».',true);
}

cutBtn.onclick=()=>{
  if(!selection)return; pushHistory();
  const [a,b]=getSel();
  const left=copyRange(audioBuffer,0,a), right=copyRange(audioBuffer,b,audioBuffer.duration);
  const out=makeBuffer(audioBuffer.numberOfChannels,left.length+right.length,audioBuffer.sampleRate);
  for(let c=0;c<audioBuffer.numberOfChannels;c++){
    out.getChannelData(c).set(left.getChannelData(c),0);
    out.getChannelData(c).set(right.getChannelData(c),left.length);
  }
  audioBuffer=applyFades(out);
  afterEdit('Sélection coupée. Durée : '+audioBuffer.duration.toFixed(2)+' s.');
};
trimBtn.onclick=()=>{
  if(!selection)return; pushHistory();
  const [a,b]=getSel();
  audioBuffer=applyFades(copyRange(audioBuffer,a,b));
  afterEdit('Sélection conservée. Durée : '+audioBuffer.duration.toFixed(2)+' s.');
};
silenceBtn.onclick=()=>{
  if(!selection)return; pushHistory();
  const [a,b]=getSel();
  audioBuffer=applyFades(copyRange(audioBuffer,0,audioBuffer.duration,true));
  afterEdit('Sélection rendue muette.');
};

function encodeMp3(buf,kbps=192){
  if(typeof lamejs==='undefined')throw new Error('Encodeur MP3 non chargé (connexion Internet requise).');
  const channels=Math.min(2,buf.numberOfChannels);
  const encoder=new lamejs.Mp3Encoder(channels,buf.sampleRate,kbps);
  const left=buf.getChannelData(0);
  const right=channels>1?buf.getChannelData(1):left;
  const l=new Int16Array(left.length), r=new Int16Array(right.length);
  for(let i=0;i<left.length;i++){
    l[i]=Math.max(-32768,Math.min(32767,Math.round(left[i]*32767)));
    r[i]=Math.max(-32768,Math.min(32767,Math.round(right[i]*32767)));
  }
  const parts=[], block=1152;
  for(let i=0;i<l.length;i+=block){
    const d=encoder.encodeBuffer(l.subarray(i,i+block),r.subarray(i,i+block));
    if(d.length)parts.push(new Int8Array(d));
  }
  const end=encoder.flush();
  if(end.length)parts.push(new Int8Array(end));
  return new Blob(parts,{type:'audio/mpeg'});
}
function download(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function exportBuffer(buf,label){
  if(!buf)return;
  setStatus('Encodage MP3 en cours…');
  try{
    const blob=encodeMp3(buf,192);
    download(blob,'edition-'+label+'.mp3');
    setStatus('MP3 exporté : '+label+' ('+(blob.size/1024/1024).toFixed(2)+' Mo).',true);
  }catch(err){
    console.error(err);
    setStatus('Export MP3 impossible : '+err.message);
  }
}
exportSelBtn.onclick=()=>{
  if(!selection)return;
  const [a,b]=getSel();
  exportBuffer(applyFades(copyRange(audioBuffer,a,b)),'selection');
};
exportAllBtn.onclick=()=>exportBuffer(audioBuffer,'complet');

function tick(){
  if(audioBuffer){
    const current=playing?Math.min(audioBuffer.duration,startOffset+(audioCtx.currentTime-startedAt)*parseFloat(rate.value)):startOffset;
    timeEl.textContent=current.toFixed(2)+' / '+audioBuffer.duration.toFixed(2)+' s';
  }
  requestAnimationFrame(tick);
}
tick();resizeCanvas();
</script>
</body>
</html>
