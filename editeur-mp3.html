<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur MP3 simple</title>
<style>
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:#10131a;color:#eef2f8;padding:16px}
h1{font-size:22px}
.card{background:#181c25;border:1px solid #2b3140;border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;padding:12px 16px;border-radius:10px;border:1px solid #333b4d;background:#242b39;color:#fff;cursor:pointer;margin:4px 4px 4px 0}
button:disabled{opacity:.4;cursor:not-allowed}
.primary{background:#3b82f6;border-color:#3b82f6}
canvas{width:100%;height:200px;background:#0a0d12;border:1px solid #2b3140;border-radius:10px;touch-action:none;display:block}
#audio{width:100%;margin-top:12px}
#msg{white-space:pre-wrap}
.err{color:#ff6b6b;font-weight:700}
.ok{color:#4ade80;font-weight:700}
small{color:#9aa4b2}
</style>
</head>
<body>
<h1>🎵 Éditeur MP3 simple</h1>

<div class="card">
  <input type="file" id="file" accept="audio/*,.mp3,.wav,.m4a,.ogg">
  <p id="msg">1. Choisis un fichier MP3.<br>2. Touche la forme d’onde et fais glisser.<br>3. Appuie sur « Garder la sélection » puis « Exporter MP3 ».</p>
</div>

<div class="card">
  <canvas id="wave"></canvas>
  <audio id="audio" controls></audio>
  <div style="margin-top:10px">
    <button id="play">▶︎ Lire</button>
    <button id="stop">⏹ Stop</button>
    <button id="cut">✂️ Couper sélection</button>
    <button id="keep" disabled>🎯 Garder la sélection</button>
    <button id="export" class="primary" disabled>⬇︎ Exporter MP3</button>
    <button id="exportWav">⬇︎ Exporter WAV</button>
  </div>
  <p><small>Si « Exporter MP3 » échoue, utilise « Exporter WAV » : le fichier sera lisible et convertible en MP3.</small></p>
</div>

<script>
const $=id=>document.getElementById(id);
const fileInput=$('file'),msg=$('msg'),canvas=$('wave'),ctx=canvas.getContext('2d');
const audio=$('audio'),keepBtn=$('keep'),exportBtn=$('export'),cutBtn=$('cut');
let actx=null,buffer=null,sel=null,drag=false;

function say(text,cls){msg.innerHTML=text;if(cls)msg.className=cls}
function enable(){
  keepBtn.disabled=!sel;
  exportBtn.disabled=!buffer;
  cutBtn.disabled=!sel;
}
function resize(){canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=200*devicePixelRatio;draw()}
window.onresize=resize;

fileInput.onchange=async()=>{
  const f=fileInput.files[0];
  if(!f){say('Aucun fichier choisi.','err');return}
  say('Chargement de '+f.name+'…');
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const raw=await f.arrayBuffer();
    buffer=await actx.decodeAudioData(raw);
    sel=null;enable();resize();
    audio.src=URL.createObjectURL(f);
    say('✅ Fichier chargé : '+f.name+'\nDurée : '+buffer.duration.toFixed(2)+' secondes.\n Touche maintenant la forme d’onde et fais glisser.','ok');
  }catch(e){
    console.error(e);
    say('❌ Erreur de chargement : '+e.message+'\nEssaie un autre fichier MP3 ou convertis-le en WAV.','err');
  }
};

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!buffer)return;
  const d=buffer.getChannelData(0),mid=canvas.height/2;
  const block=Math.max(1,Math.floor(d.length/canvas.width));
  ctx.strokeStyle='#60a5fa';ctx.beginPath();
  for(let x=0;x<canvas.width;x++){
    let mn=1,mx=-1;
    for(let i=x*block;i<Math.min((x+1)*block,d.length);i++){
      const v=d[i];if(v<mn)mn=v;if(v>mx)mx=v;
    }
    ctx.moveTo(x,mid+mn*mid);ctx.lineTo(x,mid+mx*mid);
  }
  ctx.stroke();
  if(sel){
    const x1=sel.a/buffer.duration*canvas.width,x2=sel.b/buffer.duration*canvas.width;
    ctx.fillStyle='rgba(59,130,246,.25)';
    ctx.fillRect(Math.min(x1,x2),0,Math.abs(x2-x1),canvas.height);
  }
}

function timeFromEvent(e){
  const r=canvas.getBoundingClientRect();
  return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*buffer.duration;
}
canvas.onpointerdown=e=>{
  if(!buffer)return;
  e.preventDefault();drag=true;canvas.setPointerCapture(e.pointerId);
  const t=timeFromEvent(e);sel={a:t,b:t};enable();draw();
  say('Sélection commencée à '+t.toFixed(2)+' s…');
};
canvas.onpointermove=e=>{
  if(!drag||!buffer)return;
  e.preventDefault();sel.b=timeFromEvent(e);draw();
};
canvas.onpointerup=e=>{
  if(!drag)return;drag=false;
  if(sel){
    sel.a=Math.min(sel.a,sel.b);sel.b=Math.max(sel.a,sel.b);
    if(sel.b-sel.a<0.05){sel=null;say('❌ Sélection trop courte. Fais glisser sur une partie plus longue.','err')}
    else{say('✅ Sélection : '+sel.a.toFixed(2)+' s à '+sel.b.toFixed(2)+' s ('+(sel.b-sel.a).toFixed(2)+' s).\nAppuie sur « Garder la sélection ».','ok')}
  }
  enable();draw();
};

function sub(a,b){
  const sr=buffer.sampleRate,s=Math.floor(a*sr),e=Math.floor(b*sr);
  const out=actx.createBuffer(buffer.numberOfChannels,Math.max(1,e-s),sr);
  for(let c=0;c<buffer.numberOfChannels;c++){
    out.getChannelData(c).set(buffer.getChannelData(c).subarray(s,e));
  }
  return out;
}
$('play').onclick=()=>{
  if(!buffer)return;
  const src=actx.createBufferSource();src.buffer=buffer;
  src.connect(actx.destination);src.start(0,sel?sel.a:0);
};
$('stop').onclick=()=>{audio.pause();audio.currentTime=0};
cutBtn.onclick=()=>{
  if(!sel)return;
  const left=sub(0,sel.a),right=sub(sel.b,buffer.duration);
  const out=actx.createBuffer(buffer.numberOfChannels,left.length+right.length,buffer.sampleRate);
  for(let c=0;c<buffer.numberOfChannels;c++){
    out.getChannelData(c).set(left.getChannelData(c),0);
    out.getChannelData(c).set(right.getChannelData(c),left.length);
  }
  buffer=out;sel=null;enable();draw();
  say('✅ Sélection coupée. Nouvelle durée : '+buffer.duration.toFixed(2)+' s.\nAppuie sur « Exporter MP3 » ou « Exporter WAV ».','ok');
};
keepBtn.onclick=()=>{
  if(!sel)return;
  buffer=sub(sel.a,sel.b);sel=null;enable();draw();
  say('✅ Sélection conservée. Durée : '+buffer.duration.toFixed(2)+' s.\nAppuie maintenant sur « Exporter MP3 ».','ok');
};

function wavBlob(buf){
  const ch=buf.numberOfChannels,len=buf.length,sr=buf.sampleRate;
  const ab=new ArrayBuffer(44+len*ch*2),v=new DataView(ab);
  const str=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  str(0,'RIFF');v.setUint32(4,36+len*ch*2,true);str(8,'WAVE');str(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);
  str(36,'data');v.setUint32(40,len*ch*2,true);
  let o=44;
  for(let i=0;i<len;i++)for(let c=0;c<ch;c++){
    const x=Math.max(-1,Math.min(1,buf.getChannelData(c)[i]));
    v.setInt16(o,x<0?x*32768:x*32767,true);o+=2;
  }
  return new Blob([ab],{type:'audio/wav'});
}
function save(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();
}
$('exportWav').onclick=()=>{
  if(!buffer)return;
  save(wavBlob(buffer),'edition.wav');
  say('✅ Fichier WAV téléchargé.','ok');
};
exportBtn.onclick=()=>{
  if(!buffer)return;
  say('Encodage MP3…');
  try{
    if(typeof lamejs==='undefined')throw new Error('lamejs n’est pas chargé. Vérifie la connexion Internet ou utilise Exporter WAV.');
    const enc=new lamejs.Mp3Encoder(Math.min(2,buffer.numberOfChannels),buffer.sampleRate,192);
    const L=buffer.getChannelData(0),R=buffer.numberOfChannels>1?buffer.getChannelData(1):L;
    const l=new Int16Array(L.length),r=new Int16Array(R.length);
    for(let i=0;i<L.length;i++){
      l[i]=Math.max(-32768,Math.min(32767,Math.round(L[i]*32767)));
      r[i]=Math.max(-32768,Math.min(32767,Math.round(R[i]*32767)));
    }
    const parts=[],N=1152;
    for(let i=0;i<l.length;i+=N){
      const d=enc.encodeBuffer(l.subarray(i,i+N),r.subarray(i,i+N));
      if(d.length)parts.push(new Int8Array(d));
    }
    const end=enc.flush();
    if(end.length)parts.push(new Int8Array(end));
    save(new Blob(parts,{type:'audio/mpeg'}),'edition.mp3');
    say('✅ Fichier MP3 téléchargé.','ok');
  }catch(e){
    console.error(e);
    say('❌ Export MP3 impossible : '+e.message+'\nUtilise « Exporter WAV ».','err');
  }
};
resize();
</script>
</body>
</html>
