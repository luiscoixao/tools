<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mathématiques">
<meta name="theme-color" content="#7c3aed">
<title>Mathématiques</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.16.11/dist/katex.min.css'">
<style>
:root{--ink:#1f1b3a;--muted:#6b6785;--bg:#fff7ee;--good:#16a34a;--bad:#e11d48;--c:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
.page{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 40px}

/* ---------- héros ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;color:#fff;
  background:linear-gradient(135deg,#7c3aed 0%,#db2777 55%,#f59e0b 100%);
  box-shadow:0 12px 30px -10px rgba(124,58,237,.6);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:180px;height:180px;right:-50px;top:-60px}
.hero::after{width:110px;height:110px;left:-30px;bottom:-50px}
.hello{position:relative;font-weight:800;font-size:16px;opacity:.9}
.hero h1{position:relative;margin:2px 0 14px;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.05}
.chips{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.goal{position:relative}
.goal .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.gbar{height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:999px;background:#fff;transition:width .6s ease}
.go{
  position:relative;display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:18px;
  background:#fff;color:#7c3aed;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.go-k{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#a78bfa}
.go-t{display:block;font-size:24px;line-height:1.15;margin:2px 0}
.go-a{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.go-s{display:block;font-size:13px;font-weight:700;color:#8b86a3}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

h2.sec{font-weight:900;font-size:22px;margin:26px 2px 12px}

/* ---------- tuiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{
  position:relative;height:0;padding-bottom:118%;border-radius:22px;cursor:pointer;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 6px 0 var(--t3);
  transition:transform .1s ease,box-shadow .1s ease;user-select:none;-webkit-user-select:none;
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--t3)}
.tile::after{content:"";position:absolute;width:70%;height:55%;right:-25%;top:-18%;border-radius:50%;background:rgba(255,255,255,.15)}
.tile .art{position:absolute;left:12%;right:12%;top:18%;height:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .art svg{width:100%;height:100%}
.tile .tex{white-space:nowrap;font-size:40px;transform-origin:center}
.tile .lbl{position:absolute;left:4px;right:4px;bottom:9%;text-align:center;font-weight:900;font-size:clamp(12px,3.8vw,19px);white-space:nowrap}
.tile .st{position:absolute;right:9px;top:7px;font-size:12px;letter-spacing:1px;z-index:1}
.tile.done .lbl::after{content:" ✓"}

/* ---------- leçon ---------- */
.lesson{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 18px 0}
.lesson.open{display:flex}
.ltop{display:flex;align-items:center;gap:12px;max-width:600px;width:100%;margin:0 auto}
.x{border:0;background:none;font-size:26px;line-height:1;padding:4px;cursor:pointer;color:#9a97b0}
.lbar{flex:1;height:14px;border-radius:999px;background:#eceaf3;overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);transition:width .4s ease}
.combo{font-weight:900;color:#f97316;min-width:48px;text-align:right;font-size:18px}
.lbody{flex:1;overflow:auto;max-width:600px;width:100%;margin:0 auto;padding:22px 2px 200px;font-size:21px;line-height:1.45}
.kicker{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--c);margin-bottom:10px}
.learn{border-radius:20px;padding:18px;background:color-mix(in srgb,var(--c) 9%,#fff);border:2px solid color-mix(in srgb,var(--c) 30%,#fff)}
.learn p{margin:0 0 12px}.learn p:last-child{margin:0}
.q{font-weight:900;font-size:24px;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;margin:0 0 12px;padding:14px 16px;font-size:21px;font-weight:700;border:2px solid #e4e2ee;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e4e2ee;cursor:pointer}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #e4e2ee}
.opt.ok{background:#dcfce7;border-color:var(--good);box-shadow:0 4px 0 var(--good);color:#14532d}
.opt.ko{background:#ffe4e6;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:#881337}
.opt:disabled{cursor:default}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(110%);transition:transform .25s ease}
.fb.show{transform:none}
.fb.good{background:#dcfce7;color:#14532d}
.fb.bad{background:#ffe4e6;color:#881337}
.fb.neutral{background:linear-gradient(transparent,#fff 30%)}
.fb h3{margin:0 0 4px;font-size:22px;font-weight:900}
.fb p{margin:0 0 12px;font-size:18px}
.cta{display:block;width:100%;max-width:600px;margin:0 auto;padding:15px;font-size:20px;font-weight:900;border:0;border-radius:16px;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.fb.good .cta{background:var(--good)}
.fb.bad .cta{background:var(--bad)}
.end{text-align:center;padding-top:16px}
.end .big{font-size:70px;line-height:1}
.end h2{font-size:32px;font-weight:900;margin:10px 0}
.end .row{display:flex;gap:10px;justify-content:center;margin:18px 0}
.end .box{border-radius:18px;background:color-mix(in srgb,var(--c) 10%,#fff);padding:12px 12px;min-width:92px;font-weight:700;font-size:15px}
.end .box b{display:block;font-size:26px;font-weight:900;color:var(--c)}
.endstars{font-size:48px;color:#f59e0b;letter-spacing:6px}
.plus{position:fixed;z-index:12;font-weight:900;color:var(--good);font-size:26px;pointer-events:none;animation:up 1s ease forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .35s}
.cta:disabled{opacity:.35;box-shadow:none}
.play{margin-top:4px}
.fig{display:block;width:100%;max-width:360px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.qimg .fig{max-width:300px;margin-bottom:8px}
.sl{font:900 26px Nunito,system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px}
.side{stroke:#1f1b3a;stroke-width:7;stroke-linecap:round;transition:stroke .2s,stroke-width .2s}
.side.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:11}}
.side.ok{stroke:#8b5cf6;stroke-width:11;animation:none}
.side.ko{stroke:#e11d48;animation:none}
.hit{stroke:transparent;stroke-width:44;stroke-linecap:round;cursor:pointer}
.hint{margin-top:12px;padding:12px 14px;border-radius:16px;background:#f4f2fb;font-size:18px;font-weight:700;text-align:center}
.eq{margin:10px 0 4px;text-align:center;font-size:26px;font-weight:900}
.eq .ok{color:var(--good)}
.sld{display:flex;align-items:center;gap:12px;margin:12px 0;font-weight:900;font-size:24px;color:var(--k)}
.sld input{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:color-mix(in srgb,var(--k) 25%,#fff);outline:none}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--k);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sld input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--k);border:4px solid #fff}
.sld b{min-width:28px;text-align:right}
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bubbles .opt{margin:0;text-align:center;font-size:30px;font-weight:900;padding:18px 8px;border-radius:22px}
.grab{cursor:grab}
.bigbtn{display:block;margin:14px auto 0;padding:14px 26px;border:0;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ax{font:800 12px Nunito,system-ui,sans-serif;text-anchor:middle;fill:#8b86a3}
.ax.big{font-size:17px;font-weight:900}
.lfig{margin:-4px 0 10px}
.learn .katex-display,.exs .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.legend{display:grid;gap:6px;margin:10px 0}
.legend div{background:#fff;border-radius:12px;padding:8px 12px;font-size:18px}
.chain{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 14px}
.cbox{border:3px solid var(--k);color:var(--k);background:#fff;border-radius:16px;padding:8px 18px;font-weight:900;font-size:22px}
.carrow{display:flex;gap:18px;font-weight:900;font-size:15px}
.carrow span:first-child{color:#7c3aed}.carrow span:last-child{color:#0891b2}
.exl{display:grid;gap:10px;margin-top:8px}
.exs{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;background:color-mix(in srgb,var(--c) 8%,#fff);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;font-size:19px}
.exs.on{opacity:1;transform:none}
.hintbtn{display:block;margin:-6px 0 14px;border:2px dashed #f59e0b;background:#fffbeb;color:#b45309;border-radius:999px;padding:7px 16px;font-weight:900;font-size:16px;cursor:pointer}
.hintbox{display:none;margin:-6px 0 14px;background:#fffbeb;border-radius:14px;padding:10px 14px;font-size:18px;color:#92400e;font-weight:700}
.hintbox.on{display:block}
.unlock{margin:10px auto 0;max-width:420px;background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:12px;font-size:18px}
.lvdots{letter-spacing:2px;font-size:11px}
.mbtn{position:absolute;left:6px;top:6px;z-index:2;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:13px;line-height:26px;box-shadow:0 2px 4px rgba(0,0,0,.18);cursor:pointer}
.mbtn:active{transform:scale(.9)}
.lmemo{border:0;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:12px;font-size:20px;padding:6px 9px;cursor:pointer}
.relink{color:inherit;font-weight:900}
.memo-wrap{position:fixed;inset:0;z-index:30;background:rgba(20,16,40,0);pointer-events:none;transition:background .25s}
.memo-wrap.open{background:rgba(20,16,40,.45);pointer-events:auto}
.memo-sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:16px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .3s ease;max-width:640px;margin:0 auto}
.memo-wrap.open .memo-sheet{transform:none}
.memo-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:21px;color:var(--c);margin-bottom:6px}
.memo-body{font-size:19px;line-height:1.5}
.memo-body p{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,#fff)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <div class="hello" id="hello">Bonjour ! 👋</div>
    <h1>Mathématiques</h1>
    <div class="chips">
      <span class="chip" id="sStreak">🔥 0 jour</span>
      <span class="chip" id="sXp">⭐ 0 XP</span>
      <span class="chip" id="sLvl">🏅 Niv. 1</span>
    </div>
    <div class="goal">
      <div class="lbl"><span>Objectif du jour</span><span id="gTxt">0 / 50 XP</span></div>
      <div class="gbar"><i id="gBar"></i></div>
    </div>
    <button class="go" id="go">▶ Commencer</button>
  </section>

  <h2 class="sec">Choisis un thème</h2>
  <div class="grid" id="grid"></div>
</div>

<div class="lesson" id="lesson">
  <div class="ltop">
    <button class="x" id="close" aria-label="Fermer">✕</button>
    <div class="lbar"><i id="lBar"></i></div>
    <button class="lmemo" id="lmemo" aria-label="Rappel de cours">📖</button>
    <span class="combo" id="combo"></span>
  </div>
  <div class="lbody" id="lbody"></div>
</div>
<div class="fb" id="fb"></div>

<script>
const r=String.raw;

/* ================= THÈMES ================= */
const CARDS=[
  {key:'ana',label:'Dérivées',    c:['#8b5cf6','#6d28d9','#4c1d95'],tex:"f'(x)",alt:'f′(x)'},
  {key:'int',label:'Intégrales',  c:['#22d3ee','#0891b2','#164e63'],tex:'\\displaystyle\\int dx',alt:'∫ dx'},
  {key:'alg',label:'Algèbre',     c:['#fb923c','#ea580c','#9a3412'],tex:'(a+b)^2',alt:'(a+b)²'},
  {key:'geo',label:'Géométrie',   c:['#2dd4bf','#0d9488','#115e59'],draw:'geometry'},
  {key:'tri',label:'Trigo',       c:['#f472b6','#db2777','#9d174d'],draw:'trig'},
  {key:'sta',label:'Statistiques',c:['#60a5fa','#2563eb','#1e3a8a'],draw:'stats'},
  {key:'pro',label:'Probabilités',c:['#38bdf8','#0284c7','#075985'],draw:'dice'},
  {key:'mat',label:'Vecteurs',    c:['#4ade80','#16a34a','#14532d'],tex:'\\vec u+\\vec v',alt:'u⃗+v⃗'},
  {key:'rac',label:'Racines',     c:['#facc15','#ca8a04','#854d0e'],tex:'\\sqrt{x+1}',alt:'√(x+1)'},
  {key:'pui',label:'Puissances',  c:['#f87171','#dc2626','#7f1d1d'],tex:'A^{-x}',alt:'A⁻ˣ'},
  {key:'ens',label:'Ensembles',   c:['#818cf8','#4f46e5','#312e81'],draw:'venn'},
  {key:'fon',label:'Fonctions',   c:['#a3e635','#65a30d','#365314'],draw:'parab'},
  {key:'sui',label:'Suites',      c:['#e879f9','#c026d3','#701a75'],tex:'u_{n+1}',alt:'uₙ₊₁'},
  {key:'exp',label:'Exp & ln',    c:['#fb7185','#e11d48','#881337'],tex:'e^{x}',alt:'eˣ'},
  {key:'pct',label:'Pourcentages',c:['#94a3b8','#475569','#1e293b'],tex:'+20\\%',alt:'+20 %'},
];

const LESSONS={
ana:{learn:[
 r`<p>La <b>dérivée</b> d'une fonction mesure sa <b>pente</b> : à quelle vitesse elle monte ou descend.</p><p>Règle d'or : $$(x^n)'=n\,x^{n-1}$$ Exemple : $(x^3)'=3x^2$.</p>`,
 r`<p>Une constante ne bouge pas : sa dérivée vaut $0$.</p><p>Un nombre devant se garde : $(5x^2)'=5\times 2x=10x$.</p><p>Pour une somme, on dérive chaque morceau : $(x^2+3x)'=2x+3$.</p>`],
 quiz:[
 {q:r`Dérivée de $x^2$ ?`,a:[r`$2x$`,r`$x$`,r`$\dfrac{x^3}{3}$`,r`$2$`],why:r`On descend l'exposant devant et on retire 1 : $2x^{1}=2x$.`},
 {q:r`Dérivée de $5x^3$ ?`,a:[r`$15x^2$`,r`$5x^2$`,r`$15x^3$`,r`$3x^2$`],why:r`$5\times 3x^2=15x^2$.`},
 {q:r`Dérivée de la constante $7$ ?`,a:[r`$0$`,r`$7$`,r`$1$`,r`$7x$`],why:r`Une constante ne varie pas : sa pente est nulle.`},
 {q:r`Dérivée de $x^2+3x$ ?`,a:[r`$2x+3$`,r`$2x+3x$`,r`$x+3$`,r`$2x$`],why:r`On dérive chaque morceau : $(x^2)'=2x$ et $(3x)'=3$.`},
]},
alg:{learn:[
 r`<p>Les <b>identités remarquables</b> font gagner un temps fou :</p><p>$$(a+b)^2=a^2+2ab+b^2$$ $$(a-b)(a+b)=a^2-b^2$$</p>`,
 r`<p>Pour résoudre une équation, on fait <b>la même opération des deux côtés</b>.</p><p>$2x+6=0 \Rightarrow 2x=-6 \Rightarrow x=-3$.</p>`],
 quiz:[
 {q:r`Développe $(x+3)^2$`,a:[r`$x^2+6x+9$`,r`$x^2+9$`,r`$x^2+3x+9$`,r`$x^2+6x+6$`],why:r`$a^2+2ab+b^2$ avec $a=x$, $b=3$ : $x^2+6x+9$.`},
 {q:r`Solution de $2x+6=0$ ?`,a:[r`$x=-3$`,r`$x=3$`,r`$x=-6$`,r`$x=12$`],why:r`$2x=-6$ donc $x=-3$.`},
 {q:r`Solutions de $x^2=16$ ?`,a:[r`$4$ et $-4$`,r`$4$ seulement`,r`$8$`,r`$256$`],why:r`$4^2=16$ et $(-4)^2=16$ : deux solutions.`},
 {q:r`Factorise $x^2-9$`,a:[r`$(x-3)(x+3)$`,r`$(x-3)^2$`,r`$(x-9)(x+1)$`,r`$x(x-9)$`],why:r`C'est $a^2-b^2=(a-b)(a+b)$ avec $b=3$.`},
]},
geo:{learn:[
 r`<p><b>Pythagore</b> : dans un triangle rectangle, $$a^2+b^2=c^2$$ où $c$ est l'<b>hypoténuse</b>, le côté opposé à l'angle droit.</p>`,
 r`<p>Aire d'un triangle : $\dfrac{\text{base}\times\text{hauteur}}{2}$.</p><p>Aire d'un disque : $\pi r^2$.</p><p>Les angles d'un triangle font toujours $180^\circ$ au total.</p>`],
 quiz:[
 {q:r`Triangle rectangle de côtés $3$ et $4$ : hypoténuse ?`,a:[r`$5$`,r`$7$`,r`$6$`,r`$\sqrt7$`],why:r`$3^2+4^2=9+16=25=5^2$.`},
 {q:r`Aire d'un triangle de base $8$ et hauteur $3$ ?`,a:[r`$12$`,r`$24$`,r`$11$`,r`$6$`],why:r`$\dfrac{8\times3}{2}=12$.`},
 {q:r`Aire d'un disque de rayon $2$ ?`,a:[r`$4\pi$`,r`$2\pi$`,r`$4$`,r`$\pi$`],why:r`$\pi\times 2^2=4\pi$.`},
 {q:r`Deux angles d'un triangle valent $50^\circ$ et $60^\circ$. Le troisième ?`,a:[r`$70^\circ$`,r`$90^\circ$`,r`$110^\circ$`,r`$80^\circ$`],why:r`$180-50-60=70$.`},
]},
tri:{learn:[
 r`<p>Sur le <b>cercle trigonométrique</b> (rayon 1), un point d'angle $x$ a pour coordonnées $(\cos x\,;\,\sin x)$.</p><p>D'où la formule-star : $$\cos^2x+\sin^2x=1$$</p>`,
 r`<p>On mesure les angles en <b>radians</b> : un demi-tour vaut $\pi$, soit $180^\circ$.</p><p>$\cos 0=1$, $\sin 0=0$, $\sin\dfrac{\pi}{2}=1$.</p>`],
 quiz:[
 {q:r`Combien vaut $\cos 0$ ?`,a:[r`$1$`,r`$0$`,r`$-1$`,r`$\dfrac12$`],why:r`L'angle 0 donne le point $(1\,;0)$ : abscisse 1.`},

/* ================= SONS ================= */
let AC=null;
function sound(ok){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const notes=ok?[523,659,784]:[220,165];
    notes.forEach((f,i)=>{
      const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+i*.09;
      o.type=ok?'triangle':'sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.25);
    });
  }catch(e){}
}

/* 1. toucher l'hypoténuse */
function mountHyp(box,done){
  const x0=70,y0=200,x1=270,y1=50;
  const side=(k,a,b,c,d)=>`<g data-s="${k}"><line class="side pulse" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/><line class="hit" x1="${a}" y1="${b}" x2="${c}" y2="${d}"/></g>`;
  box.innerHTML=`<svg viewBox="0 0 320 250" class="fig">
    <path d="M${x0} ${y0} L${x1} ${y0} L${x0} ${y1} Z" fill="${GC.soft}"/>
    <path d="M${x0} ${y0-22} h22 v22" fill="none" stroke="${GC.ink}" stroke-width="3"/>
    ${side('a',x0,y0,x1,y0)}${side('b',x0,y0,x0,y1)}${side('c',x1,y0,x0,y1)}
    <text id="hl" x="${(x0+x1)/2+30}" y="${(y0+y1)/2-12}" class="sl" fill="${GC.c}" opacity="0">c</text>
  </svg><div class="hint" id="hint">👆 Touche le côté <b>le plus long</b>, en face de l'angle droit ⬛</div>`;
  const hint=box.querySelector('#hint');
  box.querySelectorAll('g[data-s]').forEach(g=>{
    g.addEventListener('click',()=>{
      const ln=g.querySelector('.side');
      if(g.dataset.s==='c'){
        box.querySelectorAll('.side').forEach(x=>x.classList.remove('pulse'));
        ln.classList.add('ok');box.querySelector('#hl').setAttribute('opacity','1');
        hint.innerHTML='✨ Voici <b>l\'hypoténuse</b> !';
        done(`L'<b>hypoténuse</b> est le plus grand côté d'un triangle rectangle. Elle est toujours <b>en face de l'angle droit</b>.`);
      }else{
        sound(false);ln.classList.add('ko');setTimeout(()=>ln.classList.remove('ko'),600);
        hint.innerHTML='Presque ! Ce côté <b>touche</b> l\'angle droit. Cherche celui d\'<b>en face</b> 👀';
      }
    });
  });
}

/* 2. Pythagore avec curseurs */
function mountPyth(box,done){
  box.innerHTML=`<svg class="fig" id="pf"></svg>
    <div class="eq" id="peq"></div>
    <label class="sld" style="--k:${GC.a}"><span>a</span><input type="range" min="1" max="8" step="1" value="2" id="sa"><b id="va">2</b></label>
    <label class="sld" style="--k:${GC.b}"><span>b</span><input type="range" min="1" max="8" step="1" value="2" id="sb"><b id="vb">2</b></label>
    <div class="hint" id="ph">🎯 Défi : règle <b style="color:${GC.a}">a</b> et <b style="color:${GC.b}">b</b> pour que <b style="color:${GC.c}">c</b> tombe juste (un nombre entier)</div>`;
  const svg=box.querySelector('#pf'),sa=box.querySelector('#sa'),sb=box.querySelector('#sb');
  let moves=0,won=false;
  function draw(){
    const a=+sa.value,b=+sb.value,u=20,c=Math.hypot(a,b),c2=a*a+b*b,ok=Number.isInteger(c);
    box.querySelector('#va').textContent=a;box.querySelector('#vb').textContent=b;
    let s='';
    for(let i=0;i<a;i++)for(let j=0;j<a;j++)s+=`<rect x="${i*u}" y="${j*u}" width="${u}" height="${u}" fill="${GC.a}" stroke="#fff" stroke-width="2" rx="3"/>`;
    for(let i=0;i<b;i++)for(let j=0;j<b;j++)s+=`<rect x="${-(i+1)*u}" y="${-(j+1)*u}" width="${u}" height="${u}" fill="${GC.b}" stroke="#fff" stroke-width="2" rx="3"/>`;
    const P=[a*u,0],Q=[0,-b*u],n=[b*u,-a*u];
    const H=[P,Q,[Q[0]+n[0],Q[1]+n[1]],[P[0]+n[0],P[1]+n[1]]];
    s+=`<polygon points="${H.map(p=>p.join(',')).join(' ')}" fill="${GC.c}" fill-opacity="${ok?.95:.75}" stroke="#fff" stroke-width="3"/>`;
    s+=`<polygon points="0,0 ${P.join(',')} ${Q.join(',')}" fill="#fff" stroke="${GC.ink}" stroke-width="4" stroke-linejoin="round"/>`;
    s+=`<path d="M0 ${-Math.min(14,b*u/3)} h${Math.min(14,a*u/3)} v${Math.min(14,b*u/3)}" fill="none" stroke="${GC.ink}" stroke-width="2.5"/>`;
    const fs=Math.max(16,Math.min(30,u*Math.min(a,b)*.55));
    s+=`<text x="${a*u/2}" y="${a*u/2+10}" class="sl" style="font-size:${Math.max(16,a*u*.4)}px;stroke:rgba(0,0,0,.25);stroke-width:2px" fill="#fff">${a*a}</text>`;
    s+=`<text x="${-b*u/2}" y="${-b*u/2+10}" class="sl" style="font-size:${Math.max(16,b*u*.4)}px;stroke:rgba(0,0,0,.25);stroke-width:2px" fill="#fff">${b*b}</text>`;
    const cx=(P[0]+Q[0]+n[0])/2,cy=(P[1]+Q[1]+n[1])/2;
    s+=`<text x="${cx}" y="${cy+12}" class="sl" style="font-size:${Math.max(18,c*u*.35)}px;stroke:rgba(0,0,0,.25);stroke-width:2px" fill="#fff">${c2}</text>`;
    const pad=20,minX=-b*u-pad,maxX=(a+b)*u+pad,minY=-(a+b)*u-pad,maxY=a*u+pad;
    svg.setAttribute('viewBox',`${minX} ${minY} ${maxX-minX} ${maxY-minY}`);
    svg.style.maxHeight='46vh';
    svg.innerHTML=s;
    const cTxt=ok?`<span class="ok">c = ${c} 🎉</span>`:`c ≈ ${c.toFixed(2).replace('.',',')}`;
    box.querySelector('#peq').innerHTML=`<span style="color:${GC.a}">${a*a}</span> + <span style="color:${GC.b}">${b*b}</span> = <span style="color:${GC.c}">${c2}</span> → ${cTxt}`;
    if(ok&&!won){
      won=true;
      box.querySelector('#ph').innerHTML='🏆 Trouvé ! Les carrés <b style="color:#f97316">orange</b> + <b style="color:#14b8a6">verts</b> remplissent exactement le <b style="color:#8b5cf6">violet</b>.';
      done(`${a}² + ${b}² = ${c}², donc <b>c = ${c}</b>. C'est le <b>théorème de Pythagore</b> : $a^2+b^2=c^2$.`);
    }else if(!won&&moves>=8){
      box.querySelector('#ph').innerHTML='💡 Petit coup de pouce : essaie <b>a = 3</b> et <b>b = 4</b>';
    }
  }
  [sa,sb].forEach(x=>x.addEventListener('input',()=>{moves++;draw();}));
  draw();
}

/* 3. aire du triangle : on déplace le sommet */
function mountArea(box,done){
  const u=30,X0=20,Y0=170,base=8,hh=4;
  box.innerHTML=`<svg viewBox="0 0 280 210" class="fig" id="af"></svg>
    <div class="eq">Aire = <span style="color:${GC.a}">8</span> × <span style="color:${GC.b}">4</span> ÷ 2 = <span class="ok" id="av">16</span></div>
    <div class="hint" id="ah">👆 Fais glisser le <b>point violet</b> : l'aire change-t-elle ?</div>`;
  const svg=box.querySelector('#af');
  let ax=X0+2*u,travel=0,last=ax,drag=false,won=false;
  function draw(){
    let g='';
    for(let i=0;i<base;i++)for(let j=0;j<hh;j++)g+=`<rect x="${X0+i*u}" y="${Y0-(j+1)*u}" width="${u}" height="${u}" fill="none" stroke="#e4e2ee" stroke-width="1.5"/>`;
    const top=Y0-hh*u;
    svg.innerHTML=`${g}
      <rect x="${X0}" y="${top}" width="${base*u}" height="${hh*u}" fill="none" stroke="#c9c5dc" stroke-width="2.5" stroke-dasharray="8 6"/>
      <path d="M${X0} ${Y0} L${X0+base*u} ${Y0} L${ax} ${top} Z" fill="#99f6e4" fill-opacity=".85" stroke="${GC.ink}" stroke-width="4" stroke-linejoin="round"/>
      <line x1="${ax}" y1="${top}" x2="${ax}" y2="${Y0}" stroke="${GC.b}" stroke-width="3" stroke-dasharray="6 5"/>
      <text x="${X0+base*u/2}" y="${Y0+30}" class="sl" fill="${GC.a}">8</text>
      <text x="${ax+(ax>X0+base*u-30?-18:18)}" y="${Y0-hh*u/2+8}" class="sl" fill="${GC.b}">4</text>
      <circle cx="${ax}" cy="${top}" r="16" fill="${GC.c}" stroke="#fff" stroke-width="4" class="grab"/>
      <circle cx="${ax}" cy="${top}" r="30" fill="transparent" class="grab"/>`;
  }
  function move(ev){
    const p=svgPt(svg,ev);ax=Math.max(X0-20,Math.min(X0+base*u+20,p.x));
    travel+=Math.abs(ax-last);last=ax;draw();
    if(!won&&travel>4*u){
      won=true;
      box.querySelector('#ah').innerHTML='😮 L\'aire reste <b>16</b>, quelle que soit la forme !';
      done(`L'aire d'un triangle ne dépend que de sa <b>base</b> et de sa <b>hauteur</b> : c'est toujours la moitié du rectangle, $\\dfrac{\\text{base}\\times\\text{hauteur}}{2}$.`);
    }
  }
  svg.addEventListener('pointerdown',e=>{drag=true;svg.setPointerCapture(e.pointerId);move(e);});
  svg.addEventListener('pointermove',e=>{if(drag)move(e);});
  svg.addEventListener('pointerup',()=>drag=false);
  svg.addEventListener('pointercancel',()=>drag=false);
  draw();
}

/* 4. découper les trois angles */
function mountAngles(box,done){
  const A=[40,170],B=[280,170],C=[140,40],M=[160,250],R=34;
  const V=[A,B,C],cols=[GC.a,GC.b,GC.c];
  const ang=(p,q)=>Math.atan2(q[1]-p[1],q[0]-p[0]);
  const sec=V.map((v,i)=>{
    const o=V.filter((_,j)=>j!==i);
    let s=ang(v,o[0]),e=ang(v,o[1]);
    let d=e-s;while(d<0)d+=2*Math.PI;
    if(d>Math.PI){[s,e]=[e,s];d=2*Math.PI-d;}
    return {v,s,d};
  });
  const path=(v,s,d)=>`M${v[0]} ${v[1]} L${v[0]+R*Math.cos(s)} ${v[1]+R*Math.sin(s)} A${R} ${R} 0 0 1 ${v[0]+R*Math.cos(s+d)} ${v[1]+R*Math.sin(s+d)} Z`;
  box.innerHTML=`<svg viewBox="0 0 320 290" class="fig" id="gf">
    <path d="M${A} L${B} L${C} Z" fill="${GC.soft}" stroke="${GC.ink}" stroke-width="4" stroke-linejoin="round" id="tri"/>
    <line x1="40" y1="${M[1]}" x2="280" y2="${M[1]}" stroke="${GC.ink}" stroke-width="3" stroke-dasharray="6 6" id="ln" opacity=".25"/>
    ${sec.map((s,i)=>`<path id="w${i}" d="${path(s.v,s.s,s.d)}" fill="${cols[i]}" stroke="#fff" stroke-width="2"/>`).join('')}
    <text id="t180" x="160" y="${M[1]-46}" class="sl" fill="${GC.ink}" opacity="0">180°</text>
  </svg>
  <button class="bigbtn" id="cut">✂️ Découper les 3 angles</button>
  <div class="hint">Les 3 coins colorés sont les <b>angles</b> du triangle.</div>`;
  box.querySelector('#cut').onclick=e=>{
    e.target.disabled=true;e.target.style.opacity='.4';
    let cum=Math.PI;
    const tg=sec.map(s=>{const t=cum;cum+=s.d;return t-s.s;});
    const t0=performance.now(),D=1400;
    (function step(now){
      let t=Math.min(1,(now-t0)/D);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
      sec.forEach((s,i)=>{
        const px=s.v[0]+(M[0]-s.v[0])*t,py=s.v[1]+(M[1]-s.v[1])*t;
        box.querySelector('#w'+i).setAttribute('transform',`translate(${px} ${py}) rotate(${tg[i]*180/Math.PI*t}) translate(${-s.v[0]} ${-s.v[1]})`);
      });
      if(t<1)requestAnimationFrame(step);
      else{
        box.querySelector('#ln').setAttribute('opacity','1');
        box.querySelector('#t180').setAttribute('opacity','1');
        done(`Mis bout à bout, les 3 angles forment un <b>demi-tour</b> : leur somme fait toujours <b>180°</b>, quel que soit le triangle.`);
      }
    })(t0);
  };
}

/* --- Probabilités interactives --- */
function dieSvg(n,col){
  const P={1:[[50,50]],2:[[28,28],[72,72]],3:[[26,26],[50,50],[74,74]],4:[[28,28],[72,28],[28,72],[72,72]],5:[[26,26],[74,26],[50,50],[26,74],[74,74]],6:[[28,24],[72,24],[28,50],[72,50],[28,76],[72,76]]}[n];
  return `<svg viewBox="0 0 100 100" width="84" height="84"><rect x="6" y="6" width="88" height="88" rx="18" fill="#fff" stroke="${col}" stroke-width="5"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="${col}"/>`).join('')}</svg>`;
}
const PC='#0284c7';
function mountDice(box,done){
  const cnt=[0,0,0,0,0,0];let N=0,won=false;
  box.innerHTML=`<div style="display:flex;justify-content:center;margin:4px 0 8px" id="die">${dieSvg(6,PC)}</div>
    <svg viewBox="0 0 300 170" class="fig" id="dc"></svg>
    <div class="eq" id="dn">0 lancer</div>
    <div style="display:flex;gap:10px;justify-content:center">
      <button class="bigbtn" id="d1" style="margin:0">🎲 Lancer</button>
      <button class="bigbtn" id="d100" style="margin:0">🚀 ×100</button></div>
    <div class="hint" id="dh">Lance le dé beaucoup de fois. Que deviennent les barres ?</div>`;
  const svg=box.querySelector('#dc');
  function draw(){
    const mx=Math.max(...cnt.map(c=>c/Math.max(N,1)),1/6*1.5);
    let s='';
    const y0=140,H=104,line=y0-H*(1/6)/mx;
    cnt.forEach((c,i)=>{
      const f=N?c/N:0,h=H*f/mx,x=22+i*46;
      s+=`<rect x="${x}" y="${y0-h}" width="34" height="${h}" rx="6" fill="${PC}" opacity="${.55+.07*i}"/>
          <text x="${x+17}" y="${y0+24}" class="sl" style="font-size:20px" fill="${PC}">${i+1}</text>
          <text x="${x+17}" y="${y0-h-6}" style="font:800 12px Nunito;text-anchor:middle" fill="#6b6785">${N?Math.round(f*100)+'%':''}</text>`;
    });
    s+=`<line x1="14" y1="${line}" x2="290" y2="${line}" stroke="#f97316" stroke-width="3" stroke-dasharray="8 6"/>
        <text x="150" y="16" style="font:900 15px Nunito;text-anchor:middle" fill="#f97316">- - -  chance théorique : 1/6 ≈ 17 %</text>
        <line x1="14" y1="${y0}" x2="290" y2="${y0}" stroke="#1f1b3a" stroke-width="3"/>`;
    svg.innerHTML=s;
    box.querySelector('#dn').textContent=N+' lancer'+(N>1?'s':'');
  }
  function roll(k){
    let last=1;
    for(let i=0;i<k;i++){last=1+Math.floor(Math.random()*6);cnt[last-1]++;N++;}
    const d=box.querySelector('#die');d.innerHTML=dieSvg(last,PC);d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');
    draw();
    if(!won&&N>=100){
      won=true;
      box.querySelector('#dh').innerHTML='🎯 Toutes les barres se rapprochent de la ligne orange !';
      done(`Chaque face a <b>1 chance sur 6</b>. Plus on lance, plus la fréquence approche $\\dfrac16\\approx17\\,\\%$ : c'est ça, une <b>probabilité</b>.`);
    }
  }
  box.querySelector('#d1').onclick=()=>roll(1);
  box.querySelector('#d100').onclick=()=>roll(100);
  draw();
}
function mountTree(box,done){
  const leaves=[['P','P'],['P','F'],['F','P'],['F','F']];
  const seen=new Set();
  const X0=40,X1=150,X2=262,ys=[30,80,130,180],ym=[55,155];
  let s=`<circle cx="${X0}" cy="105" r="10" fill="${PC}"/>`;
  [0,1].forEach(i=>{
    s+=`<line x1="${X0}" y1="105" x2="${X1}" y2="${ym[i]}" stroke="${PC}" stroke-width="4"/>
        <text x="${(X0+X1)/2}" y="${(105+ym[i])/2+(i?22:-8)}" style="font:800 14px Nunito;text-anchor:middle" fill="#6b6785">1/2</text>
        <circle cx="${X1}" cy="${ym[i]}" r="18" fill="#fff" stroke="${PC}" stroke-width="4"/>
        <text x="${X1}" y="${ym[i]+7}" class="sl" style="font-size:20px" fill="${PC}">${i?'F':'P'}</text>`;
    [0,1].forEach(j=>{
      const k=i*2+j;
      s+=`<line x1="${X1+18}" y1="${ym[i]}" x2="${X2-24}" y2="${ys[k]}" stroke="${PC}" stroke-width="4"/>
          <g data-k="${k}" style="cursor:pointer"><rect x="${X2-24}" y="${ys[k]-20}" width="56" height="40" rx="12" fill="#e0f2fe" stroke="${PC}" stroke-width="3" class="lf"/>
          <text x="${X2+4}" y="${ys[k]+8}" class="sl" style="font-size:22px" fill="${PC}">?</text></g>`;
    });
  });
  box.innerHTML=`<svg viewBox="0 0 310 210" class="fig">${s}</svg>
    <div class="hint" id="th">👆 Touche les 4 cases <b>?</b> pour voir tous les résultats possibles</div>`;
  box.querySelectorAll('g[data-k]').forEach(g=>g.addEventListener('click',()=>{
    const k=+g.dataset.k;if(seen.has(k))return;seen.add(k);sound(true);
    g.querySelector('rect').setAttribute('fill','#fef3c7');
    g.querySelector('text').textContent=leaves[k].join('');
    if(seen.size===4){
      box.querySelector('#th').innerHTML='4 issues, toutes avec la même chance : <b>1/4</b> chacune.';
      done(`Avec 2 pièces, il y a <b>4 issues</b> (PP, PF, FP, FF). On <b>multiplie</b> le long des branches : $\\dfrac12\\times\\dfrac12=\\dfrac14$.`);
    }
  }));
}

/* ================= RAPPELS DE COURS ================= */
const MEMOS={
 ana:r`<p><b>Dérivées</b></p><p>$(x^n)'=nx^{n-1}$ · $(k)'=0$ · $(kx^n)'=knx^{n-1}$</p><p>Dérivée $>0$ : la fonction monte ; $<0$ : elle descend.</p>`,
 int:r`<p><b>Intégrale</b> = aire sous la courbe entre $x=a$ et $x=b$ (comptée en négatif sous l'axe).</p><p><b>Primitive</b> : $F$ telle que $F'=f$. Règle : $x^n\to\dfrac{x^{n+1}}{n+1}$ · $k\to kx$ · $e^x\to e^x$ · $\dfrac1x\to\ln x$</p><p><b>Calcul</b> : $\displaystyle\int_a^b f(x)\,dx=F(b)-F(a)$</p>`,
 alg:r`<p><b>Identités remarquables</b></p><p>$(a+b)^2=a^2+2ab+b^2$</p><p>$(a-b)^2=a^2-2ab+b^2$</p><p>$(a-b)(a+b)=a^2-b^2$</p><p><b>Équations</b> : même opération des deux côtés. $x^2=k$ ($k>0$) : $x=\pm\sqrt k$.</p>`,
 geo:r`<p><b>Pythagore</b> (triangle rectangle) : $a^2+b^2=c^2$, $c$ = hypoténuse, en face de l'angle droit.</p><p><b>Aire du triangle</b> : $\dfrac{\text{base}\times\text{hauteur}}{2}$</p><p><b>Angles d'un triangle</b> : somme $=180^\circ$.</p><p><b>Disque</b> : aire $\pi r^2$, périmètre $2\pi r$.</p>`,
 tri:r`<p>Sur le cercle de rayon 1 : point $(\cos x\,;\sin x)$.</p><p>$\cos^2x+\sin^2x=1$</p><p>$\pi$ rad $=180^\circ$</p><p>$\cos0=1$, $\sin0=0$, $\cos\frac\pi2=0$, $\sin\frac\pi2=1$</p><p>Triangle rectangle : $\cos=\dfrac{\text{adj}}{\text{hyp}}$, $\sin=\dfrac{\text{opp}}{\text{hyp}}$, $\tan=\dfrac{\text{opp}}{\text{adj}}$.</p>`,
 sta:r`<p><b>Moyenne</b> : somme des valeurs ÷ nombre de valeurs.</p><p><b>Médiane</b> : valeur du milieu, une fois rangées.</p><p><b>Étendue</b> : max − min.</p><p><b>Moyenne pondérée</b> : $\dfrac{\sum x_i\times c_i}{\sum c_i}$</p>`,
 pro:r`<p>$P(A)=\dfrac{\text{cas favorables}}{\text{cas possibles}}$, toujours entre $0$ et $1$.</p><p><b>Contraire</b> : $P(\bar A)=1-P(A)$</p><p><b>Arbre</b> : on multiplie le long d'une branche, on additionne les branches.</p><p><b>Indépendants</b> : $P(A\cap B)=P(A)\times P(B)$</p>`,
 mat:r`<p><b>Vecteurs</b> : $(x;y)+(x';y')=(x+x';y+y')$</p><p><b>Produit scalaire</b> : $(x;y)\cdot(x';y')=xx'+yy'$ ; nul $\Leftrightarrow$ perpendiculaires.</p><p><b>Colinéarité</b> : $\det(\vec u,\vec v)=xy'-yx'$ ; nul $\Leftrightarrow$ colinéaires.</p><p><b>Norme</b> : $\|\vec u\|=\sqrt{x^2+y^2}$</p>`,
 rac:r`<p>$\sqrt{a}^2=a$ · $\sqrt{a^2}=|a|$</p><p>$\sqrt{ab}=\sqrt a\sqrt b$ · $\sqrt{\dfrac ab}=\dfrac{\sqrt a}{\sqrt b}$</p><p>⚠️ $\sqrt{a+b}\neq\sqrt a+\sqrt b$</p><p>$\dfrac1{\sqrt a}=\dfrac{\sqrt a}{a}$</p>`,
 pui:r`<p>$a^m\times a^n=a^{m+n}$ · $\dfrac{a^m}{a^n}=a^{m-n}$</p><p>$(a^m)^n=a^{mn}$ · $(ab)^n=a^nb^n$</p><p>$a^0=1$ · $a^{-n}=\dfrac1{a^n}$</p>`,
 ens:r`<p>$A\cap B$ : dans $A$ <b>et</b> dans $B$.</p><p>$A\cup B$ : dans $A$ <b>ou</b> dans $B$.</p><p>$\mathbb N\subset\mathbb Z\subset\mathbb Q\subset\mathbb R$</p><p>$\in$ « appartient à » · $\subset$ « est inclus dans »</p>`,
 fon:r`<p><b>Affine</b> $f(x)=ax+b$ : droite de pente $a$, coupe l'axe vertical en $b$.</p><p><b>Second degré</b> $ax^2+bx+c$ : $\Delta=b^2-4ac$</p><p>$\Delta>0$ : $x=\dfrac{-b\pm\sqrt\Delta}{2a}$ · $\Delta=0$ : $x=\dfrac{-b}{2a}$ · $\Delta<0$ : pas de solution.</p>`,
 sui:r`<p><b>Arithmétique</b> (on ajoute $r$) : $u_n=u_0+nr$</p><p><b>Géométrique</b> (on multiplie par $q$) : $u_n=u_0\,q^n$</p><p>$1+2+\dots+n=\dfrac{n(n+1)}{2}$</p>`,
 exp:r`<p>$e^0=1$ · $e^{a+b}=e^ae^b$ · $(e^x)'=e^x$ · $e^x>0$</p><p>$\ln1=0$ · $\ln e=1$ · $\ln(e^x)=x$ · $e^{\ln x}=x$</p><p>$\ln(ab)=\ln a+\ln b$ · $\ln(a^n)=n\ln a$ · $(\ln x)'=\dfrac1x$</p>`,
 pct:r`<p>Hausse de $t\,\%$ : $\times\left(1+\dfrac t{100}\right)$ · Baisse : $\times\left(1-\dfrac t{100}\right)$</p><p>Taux d'évolution : $\dfrac{\text{arrivée}-\text{départ}}{\text{départ}}$</p><p>Évolutions successives : on <b>multiplie</b> les coefficients.</p>`,
};

/* ================= OUTILS POUR EXERCICES GÉNÉRÉS ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1;}
/* fraction en LaTeX, simplifiée */
function fr(p,q=1){
  if(q<0){p=-p;q=-q;}
  const g=gcd(p,q);p/=g;q/=g;
  if(q===1) return String(p);
  return (p<0?'-':'')+`\\dfrac{${Math.abs(p)}}{${q}}`;
}
/* monôme a·x^n en LaTeX */
function mono(a,n){
  if(a===0) return '0';
  const c=a===1&&n>0?'':a===-1&&n>0?'-':String(a);
  return n===0?String(a):n===1?c+'x':c+`x^{${n}}`;
}
/* fabrique une question : bonne réponse en premier, distracteurs dédoublonnés */
function Q(q,good,bad,why,hint,img,extra){
  const a=[good];
  for(const b of bad){if(a.length>=4)break;if(!a.includes(b))a.push(b);}
  const n=Number(good);
  if(!isNaN(n)) for(const d of [1,-1,2,-2,3,5]){if(a.length>=4)break;const c=String(n+d);if(!a.includes(c))a.push(c);}
  return Object.assign({q,a:a.map(x=>x.startsWith('$')||x.includes('<')?x:'$'+x+'$'),why,hint,img,bubbles:true},extra||{});
}

/* ================= TRACEUR DE COURBES ================= */
function plot(o){
  const W=320,H=o.h||210,p=24,{f,x0,x1,y0,y1}=o,col=o.col||'#0891b2';
  const X=x=>p+(x-x0)/(x1-x0)*(W-2*p), Y=y=>H-p-(y-y0)/(y1-y0)*(H-2*p);
  const cy=v=>Math.max(y0,Math.min(y1,v));
  let s='';
  for(let x=Math.ceil(x0);x<=x1;x++) s+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" stroke="#eeecf5" stroke-width="1"/>`;
  const ys=o.ystep||1;
  for(let y=Math.ceil(y0/ys)*ys;y<=y1;y+=ys) s+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" stroke="#eeecf5" stroke-width="1"/>`;
  if(o.rects){
    const n=o.rects,w=(o.b-o.a)/n;
    for(let i=0;i<n;i++){const xa=o.a+i*w,h=f(xa);
      s+=`<rect x="${X(xa)}" y="${Math.min(Y(h),Y(0))}" width="${X(xa+w)-X(xa)}" height="${Math.abs(Y(h)-Y(0))}" fill="${col}" fill-opacity=".35" stroke="${col}" stroke-width="${n>25?.6:1.4}"/>`;}
  }else if(o.a!=null){
    let d=`M${X(o.a)} ${Y(0)}`;
    for(let i=0;i<=80;i++){const x=o.a+(o.b-o.a)*i/80;d+=` L${X(x)} ${Y(cy(f(x)))}`;}
    d+=` L${X(o.b)} ${Y(0)} Z`;
    s+=`<path d="${d}" fill="${o.neg?'#e11d48':col}" fill-opacity=".38"/>`;
  }
  // axes
  if(y0<=0&&y1>=0) s+=`<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="#1f1b3a" stroke-width="2.4"/><path d="M${X(x1)-7} ${Y(0)-5} L${X(x1)} ${Y(0)} L${X(x1)-7} ${Y(0)+5}" fill="none" stroke="#1f1b3a" stroke-width="2.4"/>`;
  if(x0<=0&&x1>=0) s+=`<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="#1f1b3a" stroke-width="2.4"/><path d="M${X(0)-5} ${Y(y1)+7} L${X(0)} ${Y(y1)} L${X(0)+5} ${Y(y1)+7}" fill="none" stroke="#1f1b3a" stroke-width="2.4"/>`;
  if(o.ticks!==false){
    for(let x=Math.ceil(x0);x<=x1;x+=(o.xstep||1)) if(x!==0&&!(o.a!=null&&o.bounds!==false&&(x===o.a||x===o.b))) s+=`<text x="${X(x)}" y="${Y(0)+16}" class="ax">${x}</text>`;
    for(let y=Math.ceil(y0/ys)*ys;y<=y1;y+=ys) if(y!==0) s+=`<text x="${X(0)-9}" y="${Y(y)+4}" class="ax" text-anchor="end">${y}</text>`;
  }
  // courbe
  let d='',pen=false;
  for(let i=0;i<=160;i++){const x=x0+(x1-x0)*i/160,v=f(x);if(v<y0-.5||v>y1+.5){pen=false;continue;}d+=(pen?' L':' M')+`${X(x).toFixed(1)} ${Y(v).toFixed(1)}`;pen=true;}
  s+=`<path d="${d.trim()}" fill="none" stroke="#1f1b3a" stroke-width="3.4" stroke-linecap="round"/>`;
  if(o.a!=null&&o.bounds!==false){
    [[o.a,o.la??'a'],[o.b,o.lb??'b']].forEach(([x,l])=>{
      s+=`<line x1="${X(x)}" y1="${Y(0)}" x2="${X(x)}" y2="${Y(cy(f(x)))}" stroke="${o.neg?'#e11d48':col}" stroke-width="2.4" stroke-dasharray="5 4"/>`;
      if(l!=='') s+=`<text x="${X(x)}" y="${Y(0)+(o.neg?-8:34)}" class="ax big" fill="${o.neg?'#e11d48':col}">${l}</text>`;
    });
  }
  if(o.fl) s+=`<text x="${X(o.fl[0])}" y="${Y(o.fl[1])}" class="ax big" fill="#1f1b3a">${o.fl[2]}</text>`;
  if(o.inside) s+=`<text x="${X((o.a+o.b)/2)}" y="${Y(o.inside[1])}" class="ax big" fill="${o.neg?'#9f1239':'#0e4f63'}">${o.inside[0]}</text>`;
  return `<svg viewBox="0 0 ${W} ${H+(o.a!=null&&!o.neg?14:0)}" class="fig">${s}</svg>`;
}

const IC='#0891b2';
function mountRiemann(box,done){
  const f=x=>x*x/4+1,exact=28/3;
  box.innerHTML=`<div id="rf"></div>
    <div class="eq" id="req"></div>
    <label class="sld" style="--k:${IC}"><span>▮</span><input type="range" min="1" max="60" value="2" id="rn"><b id="rv">2</b></label>
    <div class="hint" id="rh">👉 Augmente le nombre de rectangles</div>`;
  const inp=box.querySelector('#rn');let won=false;
  function draw(){
    const n=+inp.value,w=4/n;let sum=0;for(let i=0;i<n;i++)sum+=f(i*w)*w;
    box.querySelector('#rf').innerHTML=plot({f,x0:-.4,x1:4.6,y0:-.6,y1:5.4,a:0,b:4,rects:n,la:'0',lb:'4',col:IC});

    if(n>=30&&!won){won=true;
      box.querySelector('#rh').innerHTML='🎯 Avec des rectangles très fins, on tombe presque pile sur l\'aire exacte !';
      done(`Une intégrale, c'est <b>la somme d'une infinité de rectangles infiniment fins</b> sous la courbe. D'où son symbole $\\int$ : un <b>S</b> allongé, pour « <b>S</b>omme ».`);}
  }
  inp.addEventListener('input',draw);draw();
}
function mountBounds(box,done){
  const f=x=>x*x;
  box.innerHTML=`<div id="bf"></div><div class="eq" id="beq"></div>
    <label class="sld" style="--k:#f97316"><span>a</span><input type="range" min="0" max="4" value="1" id="ba"><b id="bav">1</b></label>
    <label class="sld" style="--k:${IC}"><span>b</span><input type="range" min="0" max="4" value="2" id="bb"><b id="bbv">2</b></label>
    <div class="hint" id="bh">🎯 Défi : règle <b>a</b> et <b>b</b> pour que l'aire vaille exactement <b>9</b></div>`;
  const A=box.querySelector('#ba'),B=box.querySelector('#bb');let won=false,moves=0;
  function draw(){
    let a=+A.value,b=+B.value;
    box.querySelector('#bav').textContent=a;box.querySelector('#bbv').textContent=b;
    const lo=Math.min(a,b),hi=Math.max(a,b);
    box.querySelector('#bf').innerHTML=plot({f,x0:-.5,x1:4.5,y0:-1.5,y1:17,ystep:4,a:lo,b:hi,la:'',lb:'',col:IC,fl:[3.9,15.4,'x²']});
    const v=fr(hi**3-lo**3,3);
    box.querySelector('#beq').innerHTML=a>=b?`<span style="color:#6b6785">Mets <b>a</b> plus petit que <b>b</b></span>`:
      `$\\displaystyle\\int_{${a}}^{${b}}x^2dx=\\left[\\frac{x^3}{3}\\right]_{${a}}^{${b}}=\\frac{${b**3}}{3}-\\frac{${a**3}}{3}=${v}$`;
    math(box.querySelector('#beq'));
    if(a<b&&b**3-a**3===27&&!won){won=true;
      box.querySelector('#bh').innerHTML='🏆 Trouvé : de 0 à 3, l\'aire vaut 9 !';
      done(`On a calculé l'aire <b>sans compter les carreaux</b> : une primitive de $x^2$ est $\\frac{x^3}{3}$, et $\\frac{27}{3}-\\frac{0}{3}=9$.`);}
    else if(!won&&moves>=10) box.querySelector('#bh').innerHTML='💡 Coup de pouce : essaie <b>a = 0</b> et <b>b = 3</b>';
  }
  [A,B].forEach(x=>x.addEventListener('input',()=>{moves++;draw();}));draw();
}

const GI={
  rect(){ // fonction constante → rectangle
    const k=ri(2,5),a=ri(0,2),b=a+ri(2,4),v=k*(b-a);
    return Q(r`Combien vaut $\displaystyle\int_{${a}}^{${b}}${k}\,dx$ ?`,String(v),[String(k+b-a),String(k*b),String(v+k),String(b-a)],
      r`La courbe est la droite horizontale $y=${k}$ : la zone est un <b>rectangle</b>.<br>Hauteur $${k}$ × largeur $${b}-${a}=${b-a}$ → $${v}$.`,
      'Dessine la zone : c\'est un rectangle. Aire = hauteur × largeur.',
      plot({f:()=>k,x0:-.5,x1:b+1,y0:-.8,y1:k+1.5,a,b,la:String(a),lb:String(b),col:IC,inside:[String(k)+' de haut',k/2]}));
  },
  tri(){ // f(x)=m·x de 0 à b → triangle
    const m=pick([1,2]),b=pick([2,3,4,5,6]),v=m*b*b/2;
    return Q(r`Combien vaut $\displaystyle\int_{0}^{${b}}${mono(m,1)}\,dx$ ?`,fr(m*b*b,2),[String(m*b*b),String(m*b),fr(m*b*b,4),String(b*b)],
      r`La zone est un <b>triangle</b> : base $${b}$, hauteur $${m}\times${b}=${m*b}$.<br>Aire $=\dfrac{${b}\times${m*b}}{2}=${fr(m*b*b,2)}$.`,
      'C\'est un triangle : base × hauteur ÷ 2. La hauteur, c\'est la valeur de la fonction au bout.',
      plot({f:x=>m*x,x0:-.5,x1:b+1,y0:-1,y1:m*b+1.5,ystep:m*b>8?2:1,a:0,b,la:'0',lb:String(b),col:IC}));
  },
  bornes(){ // lire les bornes sur un dessin
    const a=ri(0,2),b=a+ri(2,3);
    return Q(`Quelle intégrale correspond à la zone colorée ?`,r`$\displaystyle\int_{${a}}^{${b}}f(x)\,dx$`,
      [r`$\displaystyle\int_{${b}}^{${a}}f(x)\,dx$`,r`$\displaystyle\int_{0}^{${b+1}}f(x)\,dx$`,r`$\displaystyle\int_{${a+1}}^{${b}}f(x)\,dx$`],
      r`La zone commence à $x=${a}$ (borne du bas) et s'arrête à $x=${b}$ (borne du haut).`,
      'La borne du bas est l\'endroit où la zone commence, celle du haut où elle s\'arrête.',
      plot({f:x=>2+Math.sin(x*1.3)*.8+x*.2,x0:-.5,x1:b+1.5,y0:-.6,y1:4.5,a,b,la:String(a),lb:String(b),col:IC}),{bubbles:false});
  },
  prim(){ // primitive de a·x^n
    const n=pick([1,2,3]),k=ri(1,4),a=k*(n+1);
    return Q(r`Une primitive de $f(x)=${mono(a,n)}$ ?`,mono(k,n+1),[mono(a,n+1),mono(a*n,n-1),mono(k,n),mono(a*(n+1),n+1)],
      r`① On ajoute 1 à l'exposant : $x^{${n}}\to x^{${n+1}}$.<br>② On divise par ce nouvel exposant : $${a}\div${n+1}=${k}$.<br>→ $F(x)=${mono(k,n+1)}$. Vérif : $F'(x)=${k}\times${n+1}x^{${n}}=${mono(a,n)}$ ✓`,
      'Fais l\'inverse de la dérivée : ajoute 1 à l\'exposant, puis divise par ce nouvel exposant.');
  },
  primsum(){ // primitive de a·x + c
    const k=ri(1,4),a=2*k,c=ri(1,6);
    return Q(r`Une primitive de $f(x)=${a}x+${c}$ ?`,`${mono(k,2)}+${mono(c,1)}`,[`${mono(a,2)}+${mono(c,1)}`,`${mono(k,2)}+${c}`,String(a),`${mono(a,2)}+${c}`],
      r`On traite chaque morceau :<br>• $${a}x$ → $${a}\times\dfrac{x^2}{2}=${mono(k,2)}$<br>• $${c}$ → $${mono(c,1)}$<br>→ $F(x)=${mono(k,2)}+${mono(c,1)}$.`,
      'Morceau par morceau. Un nombre seul k devient k·x.');
  },
  primref(){ // primitives de référence
    const t=pick([
      [r`e^x`,r`e^x`,[r`xe^x`,r`e^{x+1}`,r`\dfrac{e^{x+1}}{x+1}`],r`$e^x$ est sa propre dérivée, donc c'est aussi sa propre primitive.`],
      [r`\dfrac1x`,r`\ln x`,[r`-\dfrac{1}{x^2}`,r`\dfrac{x^0}{0}`,r`x`],r`La dérivée de $\ln x$ est $\dfrac1x$ (pour $x>0$), donc $\ln x$ est une primitive de $\dfrac1x$.`],
      [r`\cos x`,r`\sin x`,[r`-\sin x`,r`\cos x`,r`-\cos x`],r`La dérivée de $\sin x$ est $\cos x$.`],
      [r`5`,r`5x`,[r`0`,r`5`,r`\dfrac{5}{x}`],r`La dérivée de $5x$ est $5$.`],
    ]);
    return Q(r`Une primitive de $f(x)=${t[0]}$ ?`,t[1],t[2],t[3],'Cherche la fonction dont la dérivée donne f.');
  },
  calc(){ // ∫ (n+1)x^n = b^(n+1) - a^(n+1)
    const n=pick([1,2]),a=pick([0,1]),b=pick([2,3]),v=b**(n+1)-a**(n+1);
    return Q(r`Calcule $\displaystyle\int_{${a}}^{${b}}${mono(n+1,n)}\,dx$`,String(v),[String(b**(n+1)+a**(n+1)),String((n+1)*(b**n-a**n)),String(b**(n+1)),String(v+n+1)],
      r`① Primitive : $F(x)=x^{${n+1}}$.<br>② $F(${b})=${b**(n+1)}$ et $F(${a})=${a**(n+1)}$.<br>③ $${b**(n+1)}-${a**(n+1)}=${v}$.`,
      'Trouve une primitive F, puis calcule F(borne du haut) − F(borne du bas).');
  },
  calcaff(){ // ∫ (2x + c)
    const c=ri(1,4),a=ri(0,2),b=a+ri(1,3),F=x=>x*x+c*x,v=F(b)-F(a);
    return Q(r`Calcule $\displaystyle\int_{${a}}^{${b}}(2x+${c})\,dx$`,String(v),[String(F(b)+F(a)),String(F(b)),String(2*b+c-(2*a+c)),String(v+c)],
      r`① Primitive : $F(x)=x^2+${mono(c,1)}$.<br>② $F(${b})=${F(b)}$ et $F(${a})=${F(a)}$.<br>③ $${F(b)}-${F(a)}=${v}$.`,
      'Primitive de 2x : x². Primitive d\'un nombre c : c·x. Puis F(haut) − F(bas).');
  },
  neg(){ // courbe sous l'axe
    const k=ri(1,3),a=ri(0,2),b=a+ri(2,3),v=-k*(b-a);
    return Q(r`Combien vaut $\displaystyle\int_{${a}}^{${b}}(-${k})\,dx$ ?`,String(v),[String(-v),'0',String(-k)],
      r`La zone est sous l'axe : son aire ($${k}\times${b-a}=${-v}$) compte <b>en négatif</b>. L'intégrale vaut $${v}$.`,
      'Quand la courbe passe sous l\'axe horizontal, l\'aire compte en négatif.',
      plot({f:()=>-k,x0:-.5,x1:b+1,y0:-k-1.2,y1:1.2,a,b,la:String(a),lb:String(b),neg:true}));
  },
};

  checkDay();
  const h=new Date().getHours();
  document.getElementById('hello').textContent=(h<18?'Bonjour':'Bonsoir')+' ! 👋';
  document.getElementById('sStreak').textContent='🔥 '+st.streak+' jour'+(st.streak>1?'s':'');
  document.getElementById('sXp').textContent='⭐ '+st.xp+' XP';
  document.getElementById('sLvl').textContent='🏅 Niv. '+(Math.floor(st.xp/100)+1);
  document.getElementById('gTxt').textContent=Math.min(st.todayXp,GOAL)+' / '+GOAL+' XP'+(st.todayXp>=GOAL?' ✓':'');
  document.getElementById('gBar').style.width=Math.min(100,st.todayXp/GOAL*100)+'%';
  const n=nextCard();
  const go=document.getElementById('go');
  const goal=st.todayXp>=GOAL;
  go.innerHTML=`<span class="go-k">${goal?'🎁 Bonus : encore une ?':'🎯 Ta leçon du jour'}</span><span class="go-t">${n.label}${LESSONS[n.key].levels&&(st.lv[n.key]||0)<LESSONS[n.key].levels.length?' · leçon '+((st.lv[n.key]||0)+1):''} <span class="go-a">→</span></span><span class="go-s">≈ 5 min · gagne des XP et des étoiles</span>`;
  go.onclick=()=>startLesson(n);
  grid.querySelectorAll('.tile').forEach(t=>{
    const k=t.dataset.key,les=LESSONS[k],s=st.best[k]||0;
    if(les.levels){const n=les.levels.length,v=Math.min(st.lv[k]||0,n);
      t.querySelector('.st').innerHTML=`<span class="lvdots">${'●'.repeat(v)}${'○'.repeat(n-v)}</span>`;}
    else t.querySelector('.st').textContent=s?'★'.repeat(s)+'☆'.repeat(3-s):'';
    t.classList.toggle('done',chapterDone(CARDS.find(c=>c.key===k)));
  });
}

/* ================= ACCUEIL ================= */
const S=`stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
const T=`fill="currentColor" font-family="Times New Roman,serif" font-style="italic" font-size="16" font-weight="bold"`;
const DRAW={
  dice:`<rect x="10" y="22" width="40" height="40" rx="9" ${S}/><rect x="52" y="14" width="40" height="40" rx="9" transform="rotate(12 72 34)" ${S}/>
    <circle cx="22" cy="34" r="4" fill="currentColor"/><circle cx="38" cy="50" r="4" fill="currentColor"/><circle cx="30" cy="42" r="4" fill="currentColor"/>
    <g transform="rotate(12 72 34)"><circle cx="63" cy="25" r="4" fill="currentColor"/><circle cx="81" cy="25" r="4" fill="currentColor"/><circle cx="63" cy="43" r="4" fill="currentColor"/><circle cx="81" cy="43" r="4" fill="currentColor"/></g>`,
  parab:`<line x1="6" y1="70" x2="94" y2="70" ${S} stroke-width="2"/><line x1="50" y1="80" x2="50" y2="4" ${S} stroke-width="2"/>
    <path d="M18 8 Q50 120 82 8" ${S}/><line x1="8" y1="62" x2="92" y2="18" ${S} stroke-width="2.4" stroke-dasharray="5 5"/>`,
  geometry:`<path d="M14 68 L82 68 L82 10 Z" ${S}/><path d="M72 68 L72 58 L82 58" ${S} stroke-width="2"/>
    <text x="40" y="34" ${T} font-style="normal">c</text><text x="87" y="44" ${T}>b</text><text x="44" y="83" ${T}>a</text>`,
  trig:`<circle cx="46" cy="46" r="26" ${S}/>
    <line x1="8" y1="46" x2="90" y2="46" ${S} stroke-width="2"/><path d="M84 41 L90 46 L84 51" ${S} stroke-width="2"/>
    <line x1="46" y1="82" x2="46" y2="6" ${S} stroke-width="2"/><path d="M41 12 L46 6 L51 12" ${S} stroke-width="2"/>
    <line x1="46" y1="46" x2="66" y2="29" ${S} stroke-width="2.4"/><circle cx="66" cy="29" r="3.5" fill="currentColor"/>`,
  stats:`${[22,36,50,66].map((h,i)=>`<rect x="${16+i*19}" y="${74-h}" width="13" height="${h}" rx="3" fill="currentColor" opacity="${.55+i*.15}"/>`).join('')}
    <line x1="8" y1="76" x2="94" y2="76" ${S}/>`,
  venn:`<circle cx="38" cy="42" r="27" fill="currentColor" fill-opacity=".25" ${S}/><circle cx="62" cy="42" r="27" fill="currentColor" fill-opacity=".25" stroke="currentColor" stroke-width="3.2"/>
    <text x="21" y="48" ${T} font-size="18">A</text><text x="69" y="48" ${T} font-size="18">B</text>`,
};
const grid=document.getElementById('grid');
function build(){
  CARDS.forEach(c=>{
    const t=document.createElement('div');
    t.className='tile';t.dataset.key=c.key;t.setAttribute('role','button');t.tabIndex=0;
    t.style.setProperty('--t1',c.c[0]);t.style.setProperty('--t2',c.c[1]);t.style.setProperty('--t3',c.c[2]);
    t.innerHTML=`<button class="mbtn" aria-label="Rappel de cours">📖</button><div class="st"></div><div class="art">${c.draw?`<svg viewBox="0 0 100 84">${DRAW[c.draw]}</svg>`:`<div class="tex">${c.alt}</div>`}</div><div class="lbl">${c.label}</div>`;
    t.addEventListener('click',()=>startLesson(c));
    t.querySelector('.mbtn').addEventListener('click',e=>{e.stopPropagation();openMemo(c.key);});
    grid.appendChild(t);
  });
  refreshStats();renderTiles();
}
function renderTiles(){
  grid.querySelectorAll('.tile').forEach((t,i)=>{
    const x=t.querySelector('.tex'); if(!x) return;
    if(window.katex&&!x.dataset.done){try{katex.render(CARDS[i].tex,x,{throwOnError:false});x.dataset.done=1;}catch(e){}}
    x.style.transform='none';
    const a=x.parentElement;
    const s=Math.min(a.clientWidth*.92/x.scrollWidth,a.clientHeight*.9/x.scrollHeight,1.8);
    if(isFinite(s)&&s>0) x.style.transform=`scale(${s})`;
  });
}

/* ================= KaTeX (avec serveur de secours) ================= */
function loadScript(srcs,cb){
  const s=document.createElement('script');s.src=srcs[0];s.onload=cb;
  s.onerror=()=>{if(srcs.length>1)loadScript(srcs.slice(1),cb);};
  document.head.appendChild(s);
}
const JS='https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/', UN='https://unpkg.com/katex@0.16.11/dist/';
function startKatex(){
  loadScript([JS+'katex.min.js',UN+'katex.min.js'],()=>{
    loadScript([JS+'contrib/auto-render.min.js',UN+'contrib/auto-render.min.js'],()=>{
      renderTiles();
      if(document.fonts&&document.fonts.ready) document.fonts.ready.then(renderTiles);
      if(L){math($body);math($fb);}
    });
  });
}

/* ================= LEÇON ================= */
const $lesson=document.getElementById('lesson'),$body=document.getElementById('lbody'),$fb=document.getElementById('fb'),
      $bar=document.getElementById('lBar'),$combo=document.getElementById('combo');
let L=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function math(el){if(window.renderMathInElement){try{renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});}catch(e){}}}

function startLesson(card){
  const les=LESSONS[card.key];
  let queue,level=null,practice=false,sub='';
  const expand=a=>a.map((s,i)=>s.type==='gen'?{...s.make(),type:'q',id:i}:{...s,type:s.type||'q',id:i});
  if(les.levels){
    level=st.lv[card.key]||0;
    if(level>=les.levels.length){
      practice=true;sub='Entraînement';
      const pool=shuffle(les.practice);
      queue=expand([{type:'learn',html:'<p>🏋️ <b>Entraînement libre</b></p><p>Des exercices tirés au hasard sur tout le chapitre. Les nombres changent à chaque fois !</p>'},
        ...Array.from({length:6},(_,i)=>({type:'gen',make:pool[i%pool.length]}))]);
    }else{sub=`Leçon ${level+1}/${les.levels.length}`;queue=expand(les.levels[level].steps);}
  }else if(les.steps){ queue=les.steps.map((s,i)=>({...s,type:s.type||'q',id:i})); }
  else{
    const qs=shuffle(les.quiz).map((q,i)=>({...q,type:'q',id:i}));
    queue=[...les.learn.map((h,i)=>({type:'learn',html:h,n:i+1,of:les.learn.length})),...qs];
  }
  L={key:card.key,label:card.label,sub,level,practice,levels:les.levels,queue,done:0,combo:0,gained:0,nq:queue.filter(s=>s.type==='q').length,missed:new Set()};
  document.documentElement.style.setProperty('--c',card.c[1]);
  $lesson.classList.add('open');document.body.style.overflow='hidden';
  render();
}
function closeLesson(){$lesson.classList.remove('open');$fb.className='fb';document.body.style.overflow='';L=null;refreshStats();}
document.getElementById('close').onclick=closeLesson;
document.getElementById('lmemo').onclick=()=>{if(L)openMemo(L.key);};
function progress(){$bar.style.width=(L.done/(L.done+L.queue.length)*100)+'%';$combo.textContent=L.combo>=2?'🔥×'+L.combo:'';}

function render(){
  progress();$fb.className='fb';
  const s=L.queue[0];
  if(!s) return finish();
  if(s.type==='learn'){
    $body.innerHTML=`<div class="kicker">${L.label}${L.sub?' · '+L.sub:''} · À retenir${s.n?` ${s.n}/${s.of}`:''}</div><div class="learn">${s.fig?`<div class="lfig">${s.fig}</div>`:''}${s.html}</div>`;
    math($body);
    $fb.className='fb neutral show';
    $fb.innerHTML=`<button class="cta">Compris !</button>`;
    $fb.querySelector('.cta').onclick=()=>{L.queue.shift();L.done++;render();};
  }else if(s.type==='ex'){
    $body.innerHTML=`<div class="kicker">${L.label}${L.sub?' · '+L.sub:''} · Exemple guidé</div><div class="q">${s.title}</div>${s.fig?`<div class="qimg">${s.fig}</div>`:''}<div class="exl">${s.lines.map(l=>`<div class="exs">${l}</div>`).join('')}</div>`;
    math($body);
    const rows=[...$body.querySelectorAll('.exs')];let shown=0;
    const next=()=>{
      if(shown<rows.length){rows[shown].classList.add('on');shown++;rows[shown-1].scrollIntoView({behavior:'smooth',block:'nearest'});}
      $fb.className='fb neutral show';
      $fb.innerHTML=shown<rows.length?`<button class="cta">Étape suivante ▶</button>`:`<button class="cta">Compris !</button>`;
      $fb.querySelector('.cta').onclick=shown<rows.length?next:()=>{L.queue.shift();L.done++;render();};
    };
    next();
  }else if(s.type==='play'){
    $body.innerHTML=`<div class="kicker">${L.label}${L.sub?' · '+L.sub:''} · ${s.title||'À toi de jouer'}</div><div class="q">${s.text}</div><div class="play"></div>`;
    $fb.className='fb neutral show';
    $fb.innerHTML=`<button class="cta" disabled>Continuer</button>`;
    math($body.querySelector('.q'));
    let finished=false;
    s.mount($body.querySelector('.play'),msg=>{
      if(finished) return; finished=true;
      sound(true);
      $fb.className='fb good show';
      $fb.innerHTML=`<h3>${['Bravo !','Bien joué !','Génial !'][Math.floor(Math.random()*3)]}</h3><p>${msg}</p><button class="cta">Continuer</button>`;
      $fb.querySelector('.cta').onclick=()=>{L.queue.shift();L.done++;render();};
      math($fb);
    });
  }else{
    const opts=s.keep?s.a.map((t,i)=>({t,ok:i===0})):shuffle(s.a.map((t,i)=>({t,ok:i===0})));
    $body.innerHTML=`<div class="kicker">${L.label}${L.sub?' · '+L.sub:''} · Question</div>${s.img?`<div class="qimg">${s.img}</div>`:''}<div class="q">${s.q}</div>${s.hint?`<button class="hintbtn">💡 Indice</button><div class="hintbox"></div>`:''}<div id="opts" class="${s.bubbles&&s.a.every(x=>x.length<60)?'bubbles':''}"></div>`;
    if(s.hint){const hb=$body.querySelector('.hintbtn');hb.onclick=()=>{s.hinted=true;hb.remove();const x=$body.querySelector('.hintbox');x.innerHTML='💡 '+s.hint;x.classList.add('on');math(x);};}
    const box=$body.querySelector('#opts');
    opts.forEach(o=>{
      const b=document.createElement('button');b.className='opt';b.innerHTML=o.t;b.dataset.ok=o.ok?1:0;
      b.onclick=()=>answer(b,o.ok,s);
      box.appendChild(b);
    });
    math($body);
  }
  $body.scrollTop=0;
}
function answer(btn,ok,s){
  $body.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  if(ok){
    btn.classList.add('ok');sound(true);
    L.combo++;
    const gain=(s.hinted?5:10)+(L.combo>=3?5:0);
    L.gained+=gain;
    floatPlus(btn,'+'+gain);
    $fb.className='fb good show';
    $fb.innerHTML=`<h3>${['Bravo !','Exact !','Parfait !','Bien vu !'][Math.floor(Math.random()*4)]}${L.combo>=3?' 🔥 '+L.combo+' d\'affilée':''}</h3><p>${s.why}</p><button class="cta">Continuer</button>`;
    $fb.querySelector('.cta').onclick=()=>{L.queue.shift();L.done++;render();};
  }else{
    btn.classList.add('ko','shake');sound(false);
    L.combo=0;L.missed.add(s.id);
    $fb.className='fb bad show';
    $fb.innerHTML=`<h3>Pas tout à fait…</h3><p>Bonne réponse : ${s.a[0]}<br>${s.why}</p><p><a href="#" class="relink">📖 Revoir le cours</a></p><button class="cta">Je la reverrai</button>`;
    $fb.querySelector('.relink').onclick=e=>{e.preventDefault();openMemo(L.key);};
    $fb.querySelector('.cta').onclick=()=>{L.queue.push(L.queue.shift());render();};
  }
  math($fb);progress();
}
function floatPlus(el,txt){
  const b=el.getBoundingClientRect(),d=document.createElement('div');
  d.className='plus';d.textContent=txt+' XP';d.style.left=(b.right-90)+'px';d.style.top=b.top+'px';
  document.body.appendChild(d);setTimeout(()=>d.remove(),1000);
}
function finish(){
  const first=L.nq-L.missed.size;
  const stars=first===L.nq?3:first>=L.nq-1?2:1;
  const total=L.gained+20+(stars===3?10:0);
  checkDay();
  const t=dayStr(new Date());
  if(st.last!==t){st.streak=(st.streak||0)+1;st.last=t;}
  const before=st.todayXp;
  st.xp+=total;st.todayXp+=total;
  st.best[L.key]=Math.max(st.best[L.key]||0,stars);
  let unlock='';
  if(L.levels&&!L.practice){
    st.lv[L.key]=Math.max(st.lv[L.key]||0,L.level+1);
    unlock=L.level+1<L.levels.length?`<div class="unlock">🔓 Leçon ${L.level+2} débloquée : <b>${L.levels[L.level+1].title}</b></div>`
      :`<div class="unlock">🏁 Chapitre terminé ! L'<b>entraînement</b> est débloqué : des exercices toujours nouveaux.</div>`;
  }
  save();
  $bar.style.width='100%';$combo.textContent='';
  const goalHit=before<GOAL&&st.todayXp>=GOAL;
  $body.innerHTML=`<div class="end">
    <div class="big">${stars===3?'🏆':'🎉'}</div>
    <h2>${stars===3?'Sans faute !':'Leçon terminée !'}</h2>
    <div class="endstars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="row">
      <div class="box"><b>+${total}</b>XP</div>
      <div class="box"><b>${first}/${L.nq}</b>du 1er coup</div>
      <div class="box"><b>🔥 ${st.streak}</b>jour${st.streak>1?'s':''}</div>
    </div>
    ${unlock}
    ${goalHit?'<p><b>Objectif du jour atteint !</b> Reviens demain pour garder ta série.</p>':''}
  </div>`;
  $fb.className='fb neutral show';
  $fb.innerHTML=`<button class="cta">Retour à l'accueil</button>`;
  $fb.querySelector('.cta').onclick=closeLesson;
  confetti();
}
function confetti(){
  const cols=['#8b5cf6','#f97316','#14b8a6','#ec4899','#3b82f6','#22c55e','#eab308'];
  for(let i=0;i<50;i++){
    const c=document.createElement('div');c.className='conf';
    c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];
    c.style.animationDuration=(1.6+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.4)+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),3500);
  }
}

/* ================= DÉMARRAGE (sans attendre les serveurs externes) ================= */
document.addEventListener('touchstart',()=>{},{passive:true});
build();
startKatex();
window.addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(renderTiles,100);});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!L)refreshStats();});
</script>
