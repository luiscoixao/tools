<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mathématiques">
<meta name="theme-color" content="#7c3aed">
<title>Mathématiques</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      onerror="this.onerror=null;this.href='https://unpkg.com/katex@0.16.11/dist/katex.min.css'">
<style>
:root{--ink:#1f1b3a;--muted:#6b6785;--bg:#fff7ee;--good:#16a34a;--bad:#e11d48;--c:#7c3aed}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);font-family:'Nunito',system-ui,-apple-system,sans-serif;color:var(--ink)}
button{font:inherit;color:inherit}
.page{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px 40px}

/* ---------- héros ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 18px;color:#fff;
  background:linear-gradient(135deg,#7c3aed 0%,#db2777 55%,#f59e0b 100%);
  box-shadow:0 12px 30px -10px rgba(124,58,237,.6);
}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero::before{width:180px;height:180px;right:-50px;top:-60px}
.hero::after{width:110px;height:110px;left:-30px;bottom:-50px}
.hello{position:relative;padding-right:56px;font-weight:800;font-size:16px;opacity:.9}
.hero h1{position:relative;margin:2px 0 14px;font-weight:900;font-size:clamp(28px,8.4vw,40px);line-height:1.05}
.chips{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 12px;font-weight:800;font-size:16px;white-space:nowrap}
.goal{position:relative}
.goal .lbl{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:6px}
.gbar{height:12px;border-radius:999px;background:rgba(255,255,255,.3);overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:999px;background:#fff;transition:width .6s ease}
.go{
  position:relative;display:block;width:100%;margin-top:16px;padding:14px;border:0;border-radius:18px;
  background:#fff;color:#7c3aed;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);
}
.go-k{display:block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:#a78bfa}
.go-t{display:block;font-size:24px;line-height:1.15;margin:2px 0}
.go-a{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(6px)}}
.go-s{display:block;font-size:13px;font-weight:700;color:#8b86a3}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}

h2.sec{font-weight:900;font-size:22px;margin:26px 2px 12px}

/* ---------- tuiles ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{
  position:relative;height:0;padding-bottom:118%;border-radius:22px;cursor:pointer;color:#fff;overflow:hidden;
  background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 6px 0 var(--t3);
  transition:transform .1s ease,box-shadow .1s ease;user-select:none;-webkit-user-select:none;
}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 var(--t3)}
.tile::after{content:"";position:absolute;width:70%;height:55%;right:-25%;top:-18%;border-radius:50%;background:rgba(255,255,255,.15)}
.tile .art{position:absolute;left:12%;right:12%;top:18%;height:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.tile .art svg{width:100%;height:100%}
.tile .tex{white-space:nowrap;font-size:40px;transform-origin:center}
.tile .lbl{position:absolute;left:4px;right:4px;bottom:9%;text-align:center;font-weight:900;font-size:clamp(12px,3.8vw,19px);white-space:nowrap}
.tile .st{position:absolute;right:9px;top:7px;font-size:12px;letter-spacing:1px;z-index:1}
.tile.done .lbl::after{content:" ✓"}

/* ---------- leçon ---------- */
.lesson{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:#fff;padding:calc(env(safe-area-inset-top) + 12px) 18px 0}
.lesson.open{display:flex}
.ltop{display:flex;align-items:center;gap:12px;max-width:600px;width:100%;margin:0 auto}
.x{border:0;background:none;font-size:26px;line-height:1;padding:4px;cursor:pointer;color:#9a97b0}
.lbar{flex:1;height:14px;border-radius:999px;background:#eceaf3;overflow:hidden}
.lbar i{display:block;height:100%;width:0;border-radius:999px;background:var(--c);transition:width .4s ease}
.combo{font-weight:900;color:#f97316;min-width:48px;text-align:right;font-size:18px}
.lbody{flex:1;overflow:auto;max-width:600px;width:100%;margin:0 auto;padding:22px 2px 200px;font-size:21px;line-height:1.45}
.kicker{font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--c);margin-bottom:10px}
.learn{border-radius:20px;padding:18px;background:color-mix(in srgb,var(--c) 9%,#fff);border:2px solid color-mix(in srgb,var(--c) 30%,#fff)}
.learn p{margin:0 0 12px}.learn p:last-child{margin:0}
.q{font-weight:900;font-size:24px;margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;margin:0 0 12px;padding:14px 16px;font-size:21px;font-weight:700;border:2px solid #e4e2ee;border-radius:16px;background:#fff;box-shadow:0 4px 0 #e4e2ee;cursor:pointer}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #e4e2ee}
.opt.ok{background:#dcfce7;border-color:var(--good);box-shadow:0 4px 0 var(--good);color:#14532d}
.opt.ko{background:#ffe4e6;border-color:var(--bad);box-shadow:0 4px 0 var(--bad);color:#881337}
.opt:disabled{cursor:default}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:11;padding:16px 20px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(110%);transition:transform .25s ease}
.fb.show{transform:none}
.fb{max-height:90vh;overflow-y:auto}
.steps{list-style:none;counter-reset:st;margin:0 0 10px;padding:0}
.steps li{counter-increment:st;position:relative;padding:0 0 8px 36px;font-size:16px;line-height:1.35}
.steps li::before{content:counter(st);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:currentColor;color:#fff;font-weight:900;text-align:center;line-height:26px;font-size:15px}
.fb.bad .steps li::before{background:#be123c}
.steps li b{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.goodans{font-weight:800}
.tipbox{background:#fff7d6;color:#713f12;border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:16px;line-height:1.35}
.tipbox b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.solfig .fig{max-height:28vh;max-width:280px;margin:0 auto 8px}
.fb.good{background:#dcfce7;color:#14532d}
.fb.bad{background:#ffe4e6;color:#881337}
.fb.neutral{background:linear-gradient(transparent,#fff 30%)}
.fb h3{margin:0 0 4px;font-size:22px;font-weight:900}
.fb p{margin:0 0 12px;font-size:18px}
.cta{display:block;width:100%;max-width:600px;margin:0 auto;padding:15px;font-size:20px;font-weight:900;border:0;border-radius:16px;background:var(--c);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.fb.good .cta{background:var(--good)}
.fb.bad .cta{background:var(--bad)}
.end{text-align:center;padding-top:16px}
.end .big{font-size:70px;line-height:1}
.end h2{font-size:32px;font-weight:900;margin:10px 0}
.end .row{display:flex;gap:10px;justify-content:center;margin:18px 0}
.end .box{border-radius:18px;background:color-mix(in srgb,var(--c) 10%,#fff);padding:12px 12px;min-width:92px;font-weight:700;font-size:15px}
.end .box b{display:block;font-size:26px;font-weight:900;color:var(--c)}
.endstars{font-size:48px;color:#f59e0b;letter-spacing:6px}
.plus{position:fixed;z-index:12;font-weight:900;color:var(--good);font-size:26px;pointer-events:none;animation:up 1s ease forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.conf{position:fixed;top:-14px;width:10px;height:14px;border-radius:3px;z-index:20;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .35s}
.cta:disabled{opacity:.35;box-shadow:none}
.play{margin-top:4px}
.fig{display:block;width:100%;max-width:360px;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.qimg .fig{max-width:300px;margin-bottom:8px}
.sl{font:900 26px Nunito,system-ui,sans-serif;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:5px}
.side{stroke:#1f1b3a;stroke-width:7;stroke-linecap:round;transition:stroke .2s,stroke-width .2s}
.side.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-width:11}}
.side.ok{stroke:#8b5cf6;stroke-width:11;animation:none}
.side.ko{stroke:#e11d48;animation:none}
.hit{stroke:transparent;stroke-width:44;stroke-linecap:round;cursor:pointer}
.hint{margin-top:12px;padding:12px 14px;border-radius:16px;background:#f4f2fb;font-size:18px;font-weight:700;text-align:center}
.eq{margin:10px 0 4px;text-align:center;font-size:26px;font-weight:900}
.eq .ok{color:var(--good)}
.sld{display:flex;align-items:center;gap:12px;margin:12px 0;font-weight:900;font-size:24px;color:var(--k)}
.sld input{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:999px;background:color-mix(in srgb,var(--k) 25%,#fff);outline:none}
.sld input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--k);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.sld input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--k);border:4px solid #fff}
.sld b{min-width:28px;text-align:right}
.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bubbles .opt{margin:0;text-align:center;font-size:30px;font-weight:900;padding:18px 8px;border-radius:22px}
.grab{cursor:grab}
.bigbtn{display:block;margin:14px auto 0;padding:14px 26px;border:0;border-radius:999px;background:var(--c);color:#fff;font-weight:900;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.2);cursor:pointer}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.ax{font:800 12px Nunito,system-ui,sans-serif;text-anchor:middle;fill:#8b86a3}
.ax.big{font-size:17px;font-weight:900}
.lfig{margin:-4px 0 10px}
.learn .katex-display,.exs .katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.legend{display:grid;gap:6px;margin:10px 0}
.legend div{background:#fff;border-radius:12px;padding:8px 12px;font-size:18px}
.chain{display:flex;flex-direction:column;align-items:center;gap:4px;margin:4px 0 14px}
.cbox{border:3px solid var(--k);color:var(--k);background:#fff;border-radius:16px;padding:8px 16px;font-weight:900;font-size:20px;white-space:nowrap;max-width:100%;overflow-x:auto}
.carrow{display:flex;gap:18px;font-weight:900;font-size:15px}
.carrow span:first-child{color:#7c3aed}.carrow span:last-child{color:#0891b2}
.exl{display:grid;gap:10px;margin-top:8px}
.exs{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;background:color-mix(in srgb,var(--c) 8%,#fff);border-left:5px solid var(--c);border-radius:12px;padding:10px 14px;font-size:19px}
.exs.on{opacity:1;transform:none}
.hintbtn{display:block;margin:-6px 0 14px;border:2px dashed #f59e0b;background:#fffbeb;color:#b45309;border-radius:999px;padding:7px 16px;font-weight:900;font-size:16px;cursor:pointer}
.hintbox{display:none;margin:-6px 0 14px;background:#fffbeb;border-radius:14px;padding:10px 14px;font-size:18px;color:#92400e;font-weight:700}
.hintbox.on{display:block}
.unlock{margin:10px auto 0;max-width:420px;background:#f0fdf4;border:2px solid #86efac;border-radius:16px;padding:12px;font-size:18px}
.lvdots{letter-spacing:2px;font-size:11px}
.pbtn{position:absolute;right:14px;top:14px;z-index:2;width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:26px;line-height:46px;padding:0;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.onb{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#7c3aed,#db2777 55%,#f59e0b)}
.onb.open{display:flex}
.onb-card{width:100%;max-width:420px;max-height:92vh;overflow:auto;background:#fff;border-radius:28px;padding:22px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.onb-card h2{margin:6px 0 4px;font-size:26px;font-weight:900}
.onb-card p{margin:10px 0 6px;font-weight:700;color:#6b6785;font-size:17px}
.onb-big{font-size:64px;line-height:1.1}
.onb-card input{width:100%;padding:13px 16px;font:800 20px Nunito,system-ui,sans-serif;border:3px solid #e4e2ee;border-radius:16px;text-align:center;outline:none;color:#1f1b3a}
.onb-card input:focus{border-color:#7c3aed}
.avs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 18px}
.av{font-size:30px;padding:6px 0;border:3px solid transparent;border-radius:16px;background:#f4f2fb;cursor:pointer}
.av.on{border-color:#7c3aed;background:#ede9fe}
.onb-card .cta{background:#7c3aed}
.lnk{display:block;margin:12px auto 0;border:0;background:none;color:#6b6785;font-weight:800;font-size:16px;cursor:pointer;text-decoration:underline}
.plist{display:grid;gap:8px;margin:12px 0 8px}
.prow{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:2px solid #e4e2ee;border-radius:16px;background:#fff;font-weight:800;font-size:18px;cursor:pointer;margin-bottom:8px;text-align:left}
.prow span{font-size:26px}.prow small{color:#7c3aed}
.prow.on{border-color:#7c3aed;background:#f5f3ff}
.prow.add{border-style:dashed}
.idk{display:block;margin:4px auto 0;border:0;background:none;color:#8b86a3;font-weight:800;font-size:17px;cursor:pointer;text-decoration:underline}
.chips2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.chip2{border-radius:999px;padding:6px 12px;font-weight:800;font-size:15px}
.chip2.ok{background:#dcfce7;color:#14532d}.chip2.ko{background:#ffe4e6;color:#881337}
.tile .lvdots{font-size:12px;letter-spacing:1px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.tile.done .lbl::after{content:""}
.tile.todo::before{content:"à revoir";position:absolute;left:50%;transform:translateX(-50%);top:6px;z-index:2;background:#fff;color:#e11d48;border-radius:999px;padding:1px 8px;font-size:10px;font-weight:900;letter-spacing:.3px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);z-index:50;transform:translate(-50%,-140%);background:#1f1b3a;color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px;transition:transform .35s ease;white-space:nowrap}
.toast.on{transform:translate(-50%,0)}
.go2{position:relative;display:none;width:100%;margin-top:10px;padding:10px;border:2px solid rgba(255,255,255,.7);border-radius:16px;background:rgba(255,255,255,.18);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
.nxt{position:relative;margin-top:10px;text-align:center;font-weight:700;font-size:14px;opacity:.95}
.unlock.lvup{background:#fef3c7;border-color:#fcd34d}
.tier{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;font-size:11px;letter-spacing:.3px;vertical-align:1px}
.tier.t1{background:#dcfce7;color:#166534}.tier.t2{background:#fef3c7;color:#92400e}.tier.t3{background:#ffe4e6;color:#9f1239}
.lvlmsg{font-weight:800;font-size:16px;opacity:.85}
.mg{display:block;height:6px;border-radius:9px;background:#e5e7eb;margin-top:4px;overflow:hidden;max-width:150px}.nrow.rev .mg{margin-left:auto}.mg i{display:block;height:100%}
.mgt{display:block;font-size:11px;color:#8b86a3}
.mlist{display:grid;gap:10px}.mrow{display:flex;align-items:center;gap:10px;background:#faf9fd;border-radius:14px;padding:8px 12px}
.mrow>span{font-size:24px}.mrow>div{flex:1;min-width:0}.mrow b{display:block;font-size:15px}.mrow small{color:#8b86a3;font-size:12px}.mrow em{font-style:normal;font-weight:900}
.mgauge{height:8px;border-radius:9px;background:#e5e7eb;margin-top:4px;overflow:hidden}.mgauge i{display:block;height:100%}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.glc{border:0;background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 12px;font-weight:800;font-size:15px;cursor:pointer}
.coursbtn{border:2px solid var(--c);background:#fff;color:var(--c);border-radius:999px;padding:7px 14px;font-weight:900;font-size:15px;cursor:pointer}
.defcard{border-radius:22px;padding:16px;background:#eef2ff;border:3px solid #6366f1}.defcard .rc-top{color:#4f46e5}.defcard p{font-size:19px;line-height:1.5;margin:8px 0}
.defex{background:#fff;border-radius:12px;padding:8px 12px;font-size:17px!important}
.toolbar #saveBtn{flex:0 0 56px}
.savenag{display:none;width:100%;margin-top:10px;padding:10px;border:2px dashed #f59e0b;border-radius:16px;background:#fffbeb;color:#92400e;font-weight:800;font-size:15px;cursor:pointer}
.diag{margin:2px 0 8px;background:#fff;border-radius:14px;padding:10px 12px;font-size:17px;font-weight:700;color:#7c2d12;border-left:5px solid #f97316}
.altcard{border-radius:22px;padding:16px;background:linear-gradient(160deg,#fff7ed,#fff);border:3px solid #f97316;box-shadow:0 6px 0 #fdba74}
.altcard p{margin:0 0 10px;font-size:19px;line-height:1.5}
.prof{margin:12px 0;border-radius:18px;padding:12px 14px;background:#f5f3ff;text-align:left}
.prof-h{font-weight:900;font-size:16px;color:#5b21b6;margin-bottom:6px}
.prof-t{background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:16px;line-height:1.4}
.prof p{margin:4px 0;font-size:16px}
.mini-go{margin:4px 0 0;font-size:14px;color:#7c3aed}
.mbtn{position:absolute;left:6px;top:6px;z-index:2;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:13px;line-height:26px;box-shadow:0 2px 4px rgba(0,0,0,.18);cursor:pointer}
.mbtn:active{transform:scale(.9)}
.lmemo{border:0;background:color-mix(in srgb,var(--c) 14%,#fff);border-radius:12px;font-size:20px;padding:6px 9px;cursor:pointer}
.relink{color:inherit;font-weight:900}
.memo-wrap{position:fixed;inset:0;z-index:30;background:rgba(20,16,40,0);pointer-events:none;transition:background .25s}
.memo-wrap.open{background:rgba(20,16,40,.45);pointer-events:auto}
.memo-sheet{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:16px 20px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(100%);transition:transform .3s ease;max-width:640px;margin:0 auto}
.memo-wrap.open .memo-sheet{transform:none}
.memo-head{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:21px;color:var(--c);margin-bottom:6px}
.memo-body{font-size:19px;line-height:1.5}
.memo-body p{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--c) 8%,#fff)}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
/* ===== refonte : carte d'aventure ===== */
.daily{display:block;width:100%;margin-top:10px;padding:10px;border:0;border-radius:16px;background:#fff7ed;color:#9a3412;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.12);position:relative}
.toolbar{display:flex;gap:10px;margin:12px 0 0}
.gym{display:flex;flex-direction:column;align-items:flex-start;width:100%;margin:18px 0 0;padding:14px 18px;border:0;border-radius:20px;background:linear-gradient(120deg,#06b6d4,#3b82f6 55%,#8b5cf6);color:#fff;text-align:left;box-shadow:0 5px 0 #1e40af;cursor:pointer}
.musc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.musc button{border:0;border-radius:14px;padding:10px;background:#fff;box-shadow:0 3px 0 #e4e2ee;text-align:left;cursor:pointer}
.musc b{display:block;font-size:15px;color:var(--k)}
.musc i{display:block;height:6px;border-radius:3px;background:#eee;margin-top:6px;overflow:hidden}
.musc em{display:block;height:100%;background:var(--k)}
.gym span{font-size:21px;font-weight:900}
.gym small{font-size:14px;font-weight:700;opacity:.92}
.gym:active{transform:translateY(3px);box-shadow:0 2px 0 #1e40af}
.toolbar button{flex:1;padding:12px;border:0;border-radius:16px;background:#fff;font-weight:900;font-size:16px;box-shadow:0 4px 0 #e4e2ee;cursor:pointer}
h2.grp{font-weight:900;font-size:22px;margin:26px 4px 10px}
.island{border-radius:26px;margin:0 0 16px;padding:14px 14px 18px;background:linear-gradient(170deg,color-mix(in srgb,var(--t1) 22%,#fff),#fff 70%);box-shadow:0 6px 0 color-mix(in srgb,var(--t2) 30%,#fff);border:2px solid color-mix(in srgb,var(--t1) 45%,#fff)}
.ihead{display:flex;align-items:center;gap:10px}
.iicon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 4px 0 var(--t3)}
.itxt{flex:1;display:flex;flex-direction:column}.itxt b{font-size:20px;font-weight:900;color:var(--t3)}.itxt small{font-weight:800;color:#6b6785}
.itxt .todo{color:#e11d48}
.album1,.spd{border:0;background:#fff;border-radius:12px;width:40px;height:40px;font-size:20px;box-shadow:0 3px 0 #e4e2ee;cursor:pointer}
.path{margin-top:6px}
.nrow{display:flex;align-items:center;gap:10px;margin:8px 0}
.node{width:68px;height:68px;flex:none;border-radius:50%;border:0;cursor:pointer;font-weight:900;font-size:22px;color:#fff;background:linear-gradient(160deg,var(--t1),var(--t2));box-shadow:0 6px 0 var(--t3);transition:transform .1s}
.node:active{transform:translateY(4px);box-shadow:0 2px 0 var(--t3)}
.node.done span{font-size:14px;letter-spacing:1px;color:#fde047}
.node.cur{animation:bob 1.6s ease-in-out infinite;outline:4px solid color-mix(in srgb,var(--t1) 40%,#fff);outline-offset:4px}
@keyframes bob{50%{transform:translateY(-5px)}}
.node.lock{background:#e5e7eb;box-shadow:0 6px 0 #c7c9d1;color:#9ca3af}
.node.boss{width:80px;height:80px;font-size:34px;background:linear-gradient(160deg,#fbbf24,#f59e0b);box-shadow:0 6px 0 #b45309}
.node.boss.lock{background:#e5e7eb;box-shadow:0 6px 0 #c7c9d1}
.node.prac{background:linear-gradient(160deg,#a78bfa,#7c3aed);box-shadow:0 6px 0 #5b21b6}
.node.prac.lock{background:#e5e7eb;box-shadow:0 6px 0 #c7c9d1}
.nrow.rev{flex-direction:row-reverse}.nrow.rev .nlab{text-align:right}
.nlab{flex:1;min-width:0;font-weight:800;font-size:15px;color:#3f3b5a;line-height:1.2}
/* ===== épisode ===== */
.muted{color:#8b86a3;font-size:16px;font-weight:700}
.hook{font-size:22px;line-height:1.5;font-weight:700;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,#fff),#fff);border-radius:22px;padding:18px;border:2px solid color-mix(in srgb,var(--c) 30%,#fff)}
.hook p{margin:0 0 10px}.hook p:last-child{margin:0}
.rcard{border-radius:24px;padding:16px 16px 18px;background:#fff;border:3px solid var(--k);box-shadow:0 8px 0 color-mix(in srgb,var(--k) 55%,#000)}
.rc-top{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--k)}
.rc-t{font-size:24px;font-weight:900;margin:2px 0 8px}
.rc-b{font-size:19px;line-height:1.5}.rc-b p{margin:0 0 10px}
.ibox .q{margin-bottom:14px}
.hrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.hrow .hintbtn{margin:0}
.solbtn{border:2px dashed #c7c9d1;background:#fff;color:#6b6785;border-radius:999px;padding:7px 14px;font-weight:900;font-size:15px;cursor:pointer}
.hints .hintbox{margin:0 0 10px}
.opts .opt{margin-bottom:10px}
.opts.bubbles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.bubbles .opt{margin:0;text-align:center;font-size:24px;font-weight:900;padding:16px 6px;border-radius:20px}
.tfcard{position:relative;margin:4px auto 14px;max-width:340px;border-radius:24px;padding:22px 16px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,#fff),#fff);border:3px solid var(--c);box-shadow:0 8px 0 color-mix(in srgb,var(--c) 40%,#fff);touch-action:pan-y;transition:transform .25s;cursor:grab;user-select:none;-webkit-user-select:none}
.tfcard.goR{transform:translateX(120%) rotate(18deg)!important;opacity:0}.tfcard.goL{transform:translateX(-120%) rotate(-18deg)!important;opacity:0}
.tflab{font-size:13px;font-weight:900;text-transform:uppercase;color:var(--c)}.tfprop{font-size:30px;font-weight:900;margin:8px 0}.tfsw{font-size:14px;color:#8b86a3;font-weight:800}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tfbtns .opt{text-align:center;font-weight:900}
.inp{margin:0 auto 12px;max-width:300px;border:3px solid #e4e2ee;border-radius:18px;padding:12px;text-align:center;font-size:32px;font-weight:900;min-height:64px}
.inp.ok{border-color:var(--good);background:#dcfce7}.inp.ko{border-color:var(--bad);background:#ffe4e6}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.key{padding:14px 0;border:0;border-radius:14px;background:#f4f2fb;font-size:24px;font-weight:900;box-shadow:0 3px 0 #e4e2ee;cursor:pointer}
.key:active{transform:translateY(2px);box-shadow:none}.key.del{background:#fee2e2}.key.okk{grid-column:span 2;background:var(--c);color:#fff;font-size:20px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mcol{display:grid;gap:10px;align-content:start}
.mt{padding:14px 8px;border:2px solid #e4e2ee;border-radius:16px;background:#fff;font-size:20px;font-weight:800;box-shadow:0 4px 0 #e4e2ee;cursor:pointer;min-height:58px}
.mt.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}.mt.ok{border-color:var(--good);background:#dcfce7;opacity:.75}.mt.ko{border-color:var(--bad);background:#ffe4e6}
.ord-ans{display:grid;gap:8px;margin-bottom:12px;min-height:20px}.ord-src{display:grid;gap:8px}
.ost{padding:12px 14px;border:2px solid #e4e2ee;border-radius:14px;background:#fff;font-size:18px;font-weight:700;text-align:left;box-shadow:0 3px 0 #e4e2ee;cursor:pointer}
.ost.ok{border-color:var(--good);background:#dcfce7;box-shadow:none}.ost.ko{border-color:var(--bad);background:#ffe4e6}
.nline{text-align:center}.nl-val{font-size:34px;font-weight:900;color:var(--c)}.nl-val.okc{color:var(--good)}.nl-val.koc{color:var(--bad)}
.nline input{width:100%;margin:10px 0 4px;accent-color:var(--c);height:30px}
.nl-ticks{display:flex;justify-content:space-between;font-weight:800;font-size:13px;color:#8b86a3}
.stairw{display:grid;gap:4px}.stairs{background:#fff;border-radius:12px;padding:6px 12px;font-size:20px;border:2px solid #fecaca}
.bignum{font-size:26px;font-weight:900;text-align:center;padding:18px 8px;background:#fff;border-radius:18px;border:2px solid #fecaca;word-break:break-all}
.cmp2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.cmp2>div{flex:1;min-width:90px;background:#fff;border-radius:18px;padding:12px;text-align:center;border:2px solid #e4e2ee}
.cmp2 small{display:block;font-size:16px;color:#6b6785}.cmp2 b{font-size:30px}
.tapz{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.tapz .tap{margin:0;padding:10px 16px;font-size:18px}.tap.seen{opacity:.6}
.mfig .fig{max-height:44vh}
.sparkle{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;background:#1f1b3a;color:#fff;font-weight:900;font-size:19px;border-radius:20px;padding:14px 20px;animation:pop 1.6s ease forwards}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1);opacity:0}}
.fb h3 small{font-size:15px;opacity:.8}
/* album */
.memo-sheet .sh-x{display:flex;justify-content:flex-end}
.sh-h{font-weight:900;font-size:22px;margin-bottom:6px;display:flex;flex-direction:column}.sh-h small{font-size:14px;color:#6b6785}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.mini{min-height:86px;border-radius:16px;border:3px solid var(--k);background:#fff;padding:8px;font-size:14px;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--k) 50%,#fff)}
.mini b{display:block}.mini.locked{border-style:dashed;opacity:.5;box-shadow:none}.mini small{color:#8b86a3}

</style>
</head>
<body>
<div class="page">
  <section class="hero">
    <button class="pbtn" id="pbtn" aria-label="Profil">🙂</button>
    <div class="hello" id="hello">Bonjour ! 👋</div>
    <h1>Mathématiques</h1>
    <div class="chips">
      <span class="chip" id="sStreak">🔥 0 jour</span>
      <span class="chip" id="sXp">⭐ 0 XP</span>
      <span class="chip" id="sLvl">🏅 Niv. 1</span>
    </div>
    <div class="goal">
      <div class="lbl"><span>Objectif du jour</span><span id="gTxt">0 / 50 XP</span></div>
      <div class="gbar"><i id="gBar"></i></div>
    </div>
    <button class="go" id="go">▶ Commencer</button>
    <button class="go2" id="go2"></button>
    <button class="daily" id="daily"></button>
    <div class="nxt" id="nxt"></div>
  </section>
  <button class="gym" id="gymBtn"><span>🏋️ Gym maths</span><small>2 min pour échauffer ton cerveau</small></button>
  <div class="toolbar"><button id="albumBtn">🃏 Album</button><button id="weakBtn">🧑‍🏫 Mon prof</button><button id="saveBtn">💾</button></div>
  <button class="savenag" id="saveNag" onclick="saveSheet()">💾 Pense à sauvegarder ta progression dans Fichiers</button>
  <div id="map"></div>
</div>

<div class="lesson" id="lesson">
  <div class="ltop">
    <button class="x" id="close" aria-label="Fermer">✕</button>
    <div class="lbar"><i id="lBar"></i></div>
    <button class="lmemo" id="lmemo" aria-label="Mes cartes">🃏</button>
    <span class="combo" id="combo"></span>
  </div>
  <div class="lbody" id="lbody"></div>
</div>
<div class="fb" id="fb"></div>
<div class="onb" id="onb"></div>
<div class="memo-wrap" id="sheetw"></div>
