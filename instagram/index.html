<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Instagram">
<meta name="theme-color" content="#faf7f4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>Instagram</title>
<style>
  :root{
    --bg:#faf7f4; --card:#ffffff; --line:#ece6e0; --text:#1f1d1b; --muted:#8a837c;
    --grad:linear-gradient(120deg,#ffb74d 0%,#ff6b6b 55%,#d64ca0 100%);
    --accent:#ff6b6b; --ok:#2fb67c; --shadow:0 6px 20px rgba(214,76,160,.12),0 1px 3px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none}
  header{position:sticky;top:0;z-index:5;background:rgba(250,247,244,.86);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px);
    padding:calc(env(safe-area-inset-top) + 14px) 18px 12px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0;flex:1}
  h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--muted);font-size:14px;margin-top:2px;min-height:19px}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  .chip{background:var(--card);border-radius:999px;padding:8px 15px;font-size:14px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07);transition:transform .1s}
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--grad);color:#fff}
  .bar2{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .bar2::-webkit-scrollbar{display:none}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:6px 12px calc(124px + env(safe-area-inset-bottom))}
  .cell{position:relative;aspect-ratio:1;background:#efe9e3;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:transform .15s}
  .cell:active{transform:scale(.96)}
  .cell canvas{width:100%;height:100%;object-fit:cover;display:block;transition:transform .15s,opacity .15s}
  .cell.sel{box-shadow:0 0 0 3px var(--accent),var(--shadow)}
  .cell .check{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;
    background:rgba(255,255,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;font-size:14px;font-weight:800;color:transparent;box-shadow:0 1px 4px rgba(0,0,0,.25)}
  .cell.sel .check{background:var(--grad);border-color:#fff;color:#fff}
  .cell .sent{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:var(--ok);font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .cell.isSent canvas{opacity:.5}
  .empty{text-align:center;padding:40px 30px;color:var(--muted)}
  .empty .art{width:120px;height:120px;margin:0 auto 22px;border-radius:32px;background:url(icon-512.png) center/cover;box-shadow:var(--shadow)}
  .empty .big{color:var(--text);font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:8px}
  .pick{display:inline-block;margin-top:26px;background:var(--grad);color:#fff;font-weight:700;border-radius:18px;padding:16px 28px;font-size:17px;box-shadow:var(--shadow)}
  footer{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;gap:10px;
    background:rgba(255,255,255,.82);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);
    border-radius:24px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.12)}
  footer .add{background:#f3eee9;border-radius:18px;width:56px;font-size:26px;line-height:1;color:var(--accent);font-weight:300}
  footer .go{flex:1;background:var(--grad);color:#fff;font-weight:700;border-radius:18px;padding:16px 12px;font-size:16px;transition:opacity .2s,transform .1s}
  footer .go:active{transform:scale(.98)}
  footer .go:disabled{background:#e9e3dd;color:#b3aba3}
  #viewer{position:fixed;inset:0;z-index:20;background:rgba(250,247,244,.97);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);display:none;flex-direction:column}
  #viewer.open{display:flex}
  #viewer .top{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;color:var(--muted);font-size:14px;font-weight:600}
  #viewer .stage{flex:1;display:grid;place-items:center;min-height:0;padding:0 12px}
  #viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
  #viewer .bottom{padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px}
  #viewer .bottom button{flex:1;border-radius:18px;padding:15px;background:var(--card);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  #viewer .bottom button.on{background:var(--grad);color:#fff}
  #toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--text);color:#fff;
    padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;width:max-content;max-width:90vw;text-align:center;font-size:14px;font-weight:600}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  input[type=file]{display:none}
  [hidden]{display:none!important}
  body.vide footer{display:none}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><span>Instagram</span></h1>
    <button class="chip" id="btnClear" hidden>Vider</button>
  </div>
  <div class="sub" id="info"></div>
  <div class="bar2" id="tools" hidden>
    <button class="chip" id="btnAll">Tout</button>
    <button class="chip" id="btnNone">Aucune</button>
    <button class="chip" id="btnHide">Masquer les envoyées</button>
  </div>
</header>

<main id="grid"></main>
<div class="empty" id="empty">
  <div class="art"></div>
  <div class="big">Choisis des photos dans ta photothèque</div>
  <div>Touche une photo pour la sélectionner ou non.<br>Appui long pour la voir en grand.</div>
  <button class="pick" id="btnPickBig">Choisir des photos</button>
</div>

<footer>
  <button class="add" id="btnPick" aria-label="Ajouter des photos">＋</button>
  <button class="go" id="btnGo" disabled>Enregistrer dans Instagram</button>
</footer>

<input type="file" id="file" accept="image/*" multiple>

<div id="viewer">
  <div class="top"><span id="vName"></span><button class="chip" id="vClose">Fermer</button></div>
  <div class="stage" id="vStage"><img id="vImg" alt=""></div>
  <div class="bottom">
    <button id="vPrev">‹</button>
    <button id="vSel" style="flex:3"></button>
    <button id="vNext">›</button>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const KEY="instagram-envoyees";
const stem=n=>n.replace(/\.[^.]+$/,"").replace(/ \(\d+\)$/,"").toLowerCase();

let sent=new Set();
try{ sent=new Set(JSON.parse(localStorage.getItem(KEY)||"[]")); }catch(e){}
function saveSent(){ try{ localStorage.setItem(KEY,JSON.stringify([...sent].slice(-3000))); }catch(e){} }

let items=[];        // {file,key,sel,el,sent}
let hideSent=false, vIndex=-1, vUrl=null;
const view=()=>items.filter(it=>!(hideSent&&it.sent));
const keyOf=f=>stem(f.name)+"|"+f.size;

/* ---------- miniatures, une à la fois pour ménager la mémoire de l'iPhone ---------- */
const queue=[]; let busy=false;
async function pump(){
  if(busy) return; busy=true;
  while(queue.length){
    const it=queue.shift(); if(it.thumb) continue;
    const url=URL.createObjectURL(it.file);
    try{
      const img=new Image(); img.src=url; await img.decode();
      const s=320, r=Math.max(s/img.naturalWidth, s/img.naturalHeight);
      const w=Math.round(img.naturalWidth*r), h=Math.round(img.naturalHeight*r);
      const c=document.createElement("canvas"); c.width=s; c.height=s;
      c.getContext("2d").drawImage(img,(s-w)/2,(s-h)/2,w,h);
      it.thumb=c; if(it.el) it.el.prepend(c);
    }catch(e){ it.thumb=document.createElement("canvas"); }
    URL.revokeObjectURL(url);
  }
  busy=false;
}

function render(){
  const g=$("grid"); g.innerHTML="";
  const v=view();
  v.forEach((it,i)=>{
    const d=document.createElement("div");
    d.className="cell"+(it.sel?" sel":"")+(it.sent?" isSent":"");
    d.innerHTML='<div class="check">✓</div>'+(it.sent?'<div class="sent">✓ Envoyée</div>':"");
    if(it.thumb) d.prepend(it.thumb);
    it.el=d;
    let timer=null, long=false;
    d.addEventListener("touchstart",()=>{ long=false; timer=setTimeout(()=>{ long=true; openViewer(i); },450); },{passive:true});
    d.addEventListener("touchmove",()=>clearTimeout(timer),{passive:true});
    d.addEventListener("touchend",()=>clearTimeout(timer));
    d.addEventListener("contextmenu",e=>e.preventDefault());
    d.addEventListener("click",()=>{ if(long){ long=false; return; } it.sel=!it.sel; d.classList.toggle("sel",it.sel); update(); });
    g.appendChild(d);
  });
  update();
}
function update(){
  const n=items.length, s=items.filter(i=>i.sel).length, done=items.filter(i=>i.sent).length;
  $("empty").style.display = n ? "none" : "";
  $("tools").hidden = !n; $("btnClear").hidden = !n;
  $("info").textContent = n ? `${n} photo${n>1?"s":""} · ${s} sélectionnée${s>1?"s":""}${done?` · ${done} déjà envoyée${done>1?"s":""}`:""}` : "";
  $("btnGo").disabled = !s;
  $("btnGo").textContent = s ? `Enregistrer ${s} photo${s>1?"s":""}` : "Sélectionne des photos";
  document.body.classList.toggle("vide", !n);
  $("btnHide").classList.toggle("on",hideSent);
  if(vIndex>=0){ const it=view()[vIndex]; if(it){ $("vSel").textContent = it.sel ? "✓ Sélectionnée" : "Sélectionner"; $("vSel").classList.toggle("on",it.sel); } }
}

function addFiles(list){
  const known=new Set(items.map(i=>i.key));
  for(const f of list){
    if(!f.type.startsWith("image/") && !/\.(jpe?g|png|heic|heif|webp)$/i.test(f.name)) continue;
    const k=keyOf(f); if(known.has(k)) continue; known.add(k);
    const s=sent.has(k);
    items.push({file:f,key:k,sel:!s,sent:s});
  }
  render();
  items.forEach(it=>{ if(!it.thumb) queue.push(it); }); pump();
}

/* ---------- visionneuse ---------- */
function openViewer(i){
  const v=view(); if(!v[i]) return; vIndex=i;
  if(vUrl) URL.revokeObjectURL(vUrl);
  vUrl=URL.createObjectURL(v[i].file); $("vImg").src=vUrl;
  $("vName").textContent=`${i+1} / ${v.length}`;
  $("viewer").classList.add("open"); update();
}
function closeViewer(){ $("viewer").classList.remove("open"); vIndex=-1; if(vUrl){URL.revokeObjectURL(vUrl);vUrl=null;} $("vImg").removeAttribute("src"); render(); }
function step(d){ const n=view().length; if(n) openViewer((vIndex+d+n)%n); }
let sx=0;
$("vStage").addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; },{passive:true});
$("vStage").addEventListener("touchend",e=>{ const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>50) step(dx<0?1:-1); });

/* ---------- enregistrement via la feuille de partage ---------- */
async function go(){
  const chosen=items.filter(i=>i.sel); if(!chosen.length) return;
  const files=chosen.map(i=>i.file);
  if(navigator.canShare && navigator.canShare({files})){
    try{
      await navigator.share({files});
      chosen.forEach(it=>{ it.sent=true; it.sel=false; sent.add(it.key); });
      saveSent(); render();
      toast(`${chosen.length} photo${chosen.length>1?"s":""} marquée${chosen.length>1?"s":""} comme envoyée${chosen.length>1?"s":""}`);
    }catch(e){ if(e.name!=="AbortError") toast("Partage impossible : "+e.message); }
  } else {
    // repli : téléchargement fichier par fichier
    for(const f of files){ const a=document.createElement("a"); a.href=URL.createObjectURL(f); a.download=f.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
    chosen.forEach(it=>{ it.sent=true; it.sel=false; sent.add(it.key); }); saveSent(); render();
  }
}

let tt; function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),3000); }

/* ---------- événements ---------- */
const pick=()=>$("file").click();
$("btnPick").onclick=pick; $("btnPickBig").onclick=pick;
$("file").onchange=e=>{ addFiles([...e.target.files]); e.target.value=""; };
$("btnGo").onclick=go;
$("btnAll").onclick=()=>{ view().forEach(i=>i.sel=true); render(); };
$("btnNone").onclick=()=>{ items.forEach(i=>i.sel=false); render(); };
$("btnHide").onclick=()=>{ hideSent=!hideSent; render(); };
$("btnClear").onclick=()=>{ items=[]; queue.length=0; render(); };
$("vClose").onclick=closeViewer; $("vPrev").onclick=()=>step(-1); $("vNext").onclick=()=>step(1);
$("vSel").onclick=()=>{ const it=view()[vIndex]; if(it){ it.sel=!it.sel; update(); } };
update();
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
